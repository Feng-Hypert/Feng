<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERIS // Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Grotesk:wght@700&family=Fira+Code:wght@600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', 'system-ui', '-apple-system', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 斯普拉遁 × 莫兰迪全局语义化变量与 DIY 变量 */
        :root {
            --bg-color: #F4F2EC;       /* 燕麦奶糕底 */
            --text-color: #2B2D35;     /* 铅墨线条灰 */
            --text-muted: #6E7280;     /* 疏影冷灰 */
            --card-bg: #FFFFFF;
            --surface-soft: #F8FAFC;
            --shadow-color: #2B2D35;
            --ink-main: #FF85A2;       /* 动态情绪墨水 */
            --accent-third: #DCE5F7;   /* 分类徽章柔和底色 */
            --card-radius: 18px;
            --shadow-offset: 5px;
            --solid-shadow: var(--shadow-offset) var(--shadow-offset) 0px 0px var(--shadow-color);
            --solid-shadow-sm: 3px 3px 0px 0px var(--shadow-color);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Fredoka', 'system-ui', sans-serif;
            font-weight: 700;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .border-3 { border-width: 3px; border-style: solid; }

        .pattern-dots { background-image: radial-gradient(var(--text-color) 1.5px, transparent 1.5px); background-size: 24px 24px; }
        .pattern-grid { background-image: linear-gradient(var(--text-color) 1px, transparent 1px), linear-gradient(90deg, var(--text-color) 1px, transparent 1px); background-size: 20px 20px; }
        .pattern-stripes { background-image: repeating-linear-gradient(45deg, transparent, transparent 14px, rgba(128,128,128,0.12) 14px, rgba(128,128,128,0.12) 16px); }
        .pattern-lines { background-image: linear-gradient(transparent 23px, rgba(128,128,128,0.18) 24px); background-size: 100% 24px; }
        .pattern-none { background-image: none; }

        .cel-card {
            background-color: var(--card-bg);
            border: 3px solid var(--text-color);
            border-radius: var(--card-radius);
            box-shadow: var(--solid-shadow);
        }

        .cel-btn {
            border: 3px solid var(--text-color);
            box-shadow: var(--solid-shadow-sm);
            transition: all 0.1s steps(2);
        }
        .cel-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px 0px var(--text-color); }

        .cel-input { border: 3px solid var(--text-color); background-color: #FFFFFF; color: #2B2D35; }
        .cel-input:focus { outline: none; border-color: var(--ink-main); }

        .active-option {
            border-color: var(--text-color) !important;
            transform: scale(1.04);
            box-shadow: 3px 3px 0px 0px var(--text-color) !important;
        }

        .module-content {
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            max-height: 2500px;
        }
        .module-content.collapsed { max-height: 0 !important; opacity: 0; overflow: hidden; pointer-events: none; margin-top: 0 !important; }

        @keyframes streamFlowLeft { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }
        @keyframes streamFlowRight { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 120; } }
        .rainbow-stream-1 { animation: streamFlowLeft 2.5s linear infinite; stroke-dasharray: 25, 10; }
        .rainbow-stream-2 { animation: streamFlowRight 3.5s linear infinite; stroke-dasharray: 15, 8; }
        .rainbow-stream-3 { animation: streamFlowLeft 4.5s linear infinite; stroke-dasharray: 35, 12; }

        @keyframes bleepBounce { 0%, 100% { height: 5px; } 50% { height: 14px; } }
        .bar-1 { animation: bleepBounce 0.4s steps(3) infinite alternate; }
        .bar-2 { animation: bleepBounce 0.3s steps(3) infinite alternate 0.05s; }
        .sound-muted .bar-1, .sound-muted .bar-2 { animation: none !important; height: 4px !important; }

        @keyframes celShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 2px) rotate(-2deg); }
            40% { transform: translate(3px, -1px) rotate(3deg); }
            60% { transform: translate(-2px, -2px) rotate(-1deg); }
            80% { transform: translate(2px, 1px) rotate(2deg); }
        }
        .tank-shake-active { animation: celShake 0.35s steps(4) cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

        @keyframes squidLeap {
            0% { transform: translate(-50%, 40px) scaleY(1.3) rotate(0deg); opacity: 0; }
            30% { opacity: 1; transform: translate(-50%, -40px) scaleY(1) rotate(-15deg); }
            60% { transform: translate(-50%, -110px) scaleY(0.9) rotate(15deg); opacity: 1; }
            90% { transform: translate(-50%, -50px) scaleY(1.1) rotate(45deg); opacity: 0.5; }
            100% { transform: translate(-50%, 60px) scaleY(1) rotate(90deg); opacity: 0; }
        }
        .squid-leap-active { animation: squidLeap 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        .tag-pill:hover { background-color: var(--ink-main) !important; color: #1E2229 !important; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--text-color); border-radius: 3px; }
    </style>
</head>
<body class="font-sans relative min-h-screen overflow-x-hidden p-4 sm:p-6 md:p-8 pattern-dots" id="canvasBody">

    <canvas id="splatCanvas" class="fixed inset-0 w-full h-full block z-[11] pointer-events-none"></canvas>

    <div class="relative min-h-screen flex flex-col justify-between z-20 max-w-4xl mx-auto pb-16">
        
        <header class="cel-card w-full flex justify-between items-center p-3 sm:p-4 mb-8 select-none">
            <div class="flex items-center space-x-3">
                <a href="./gallery.html" class="cel-btn font-bold text-xs bg-[#C2B4A6] text-[#2B2D35] px-4 py-2 rounded-xl">
                    ← 返回枢纽
                </a>
                <span class="hidden sm:inline-block font-display font-black text-sm tracking-wider uppercase">SPLAT_MORANDI_NOTEBOOK</span>
            </div>
            
            <div class="flex items-center space-x-2">
                <button type="button" onclick="exportNotesMarkdown()" class="cel-btn font-mono text-[11px] font-bold bg-[#FFDAC1] text-[#2B2D35] px-3 py-1.5 rounded-xl">
                    导出 .MD
                </button>
                <button id="soundToggle" type="button" class="cel-btn flex items-center space-x-1.5 font-mono text-[11px] font-bold bg-[#DCE5F7] text-[#2B2D35] px-3 py-1.5 rounded-xl">
                    <span id="soundStatus">SFX: ON</span>
                    <div class="flex items-end space-x-0.5 h-3.5 w-3.5">
                        <div class="w-0.5 bg-[#2B2D35] bar-1"></div>
                        <div class="w-0.5 bg-[#2B2D35] bar-2"></div>
                    </div>
                </button>
            </div>
        </header>

        <div class="w-full flex flex-col space-y-8 my-auto py-2">
            
            <!-- 【第一模块】：新建/编辑记事面板 -->
            <section id="section-create" class="cel-card p-4 sm:p-5 flex flex-col select-text">
                <div class="w-full relative pb-5 select-none">
                    <button type="button" onclick="toggleModule('module-create', 'arrow-create')" class="w-full flex justify-between items-center font-display font-black text-sm tracking-widest text-left">
                        <span>📓 MODULE_01 // 新建记事面板</span>
                        <span id="arrow-create" class="transform transition-transform">▼</span>
                    </button>
                    <div class="absolute inset-x-0 bottom-0 h-5 overflow-hidden pointer-events-none select-none mt-2">
                        <svg class="w-full h-full" viewBox="0 0 1000 20" preserveAspectRatio="none">
                            <path class="rainbow-stream-1" d="M0,8 C150,-4 350,24 500,8 C650,-4 850,24 1000,8" fill="none" stroke="#FFB7B2" stroke-width="4.5" stroke-linecap="round"></path>
                            <path class="rainbow-stream-2" d="M0,10 C200,24 400,-4 600,10 C800,24 900,-4 1000,10" fill="none" stroke="#BFFCC6" stroke-width="3.5" stroke-linecap="round"></path>
                            <path class="rainbow-stream-3" d="M0,12 C100,6 250,14 500,12 C750,6 900,14 1000,12" fill="none" stroke="#FFDAC1" stroke-width="4" stroke-linecap="round"></path>
                        </svg>
                    </div>
                </div>
                
                <div id="module-create" class="module-content space-y-4 mt-4">
                    <form id="noteForm" class="space-y-4 w-full">
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                            <input id="noteTitle" type="text" placeholder="输入便签主题名称..." required autocomplete="off" class="cel-input rounded-xl px-3 py-2.5 text-xs font-mono md:col-span-7">
                            <input id="noteCustomCategory" type="text" placeholder="输入自定义分类标签..." required autocomplete="off" class="cel-input rounded-xl px-3 py-2.5 text-xs font-mono md:col-span-5">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
                            <div class="sm:col-span-8 flex flex-col space-y-2">
                                <span class="text-[10px] font-mono font-black text-[var(--text-muted)] uppercase">● 盖上情绪印章:</span>
                                <div class="flex flex-wrap gap-4 select-none py-2">
                                    
                                    <div class="relative inline-block">
                                        <svg class="btn-splat-around absolute -inset-6 w-[calc(100%+48px)] h-[calc(100%+48px)] opacity-0 pointer-events-none transition-all duration-300 scale-50 z-0" viewBox="0 0 160 80" preserveAspectRatio="none">
                                            <path d="M20,40 C15,15 50,5 80,12 C115,5 145,15 140,40 C145,65 110,75 80,68 C45,75 15,60 20,40 Z" /><circle cx="30" cy="12" r="4.5" /><circle cx="135" cy="18" r="5" /><circle cx="50" cy="72" r="5" />
                                        </svg>
                                        <button type="button" data-mood="😄" onclick="selectMoodStamp(this, '😄')" class="mood-stamp-btn relative z-10 border-3 border-[var(--text-color)] bg-white text-[#2B2D35] px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold shadow-[2px_2px_0px_0px_var(--shadow-color)] transition-all">😄 喜</button>
                                    </div>

                                    <div class="relative inline-block">
                                        <svg class="btn-splat-around absolute -inset-6 w-[calc(100%+48px)] h-[calc(100%+48px)] opacity-0 pointer-events-none transition-all duration-300 scale-50 z-0" viewBox="0 0 160 80" preserveAspectRatio="none">
                                            <path d="M15,40 L35,15 L55,28 L80,5 L105,30 L135,8 L145,42 L125,52 L140,75 L95,58 L75,76 L48,54 L15,70 Z" /><circle cx="20" cy="12" r="3" /><circle cx="145" cy="12" r="4" /><circle cx="150" cy="55" r="3.5" />
                                        </svg>
                                        <button type="button" data-mood="💢" onclick="selectMoodStamp(this, '💢')" class="mood-stamp-btn relative z-10 border-3 border-[var(--text-color)] bg-white text-[#2B2D35] px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold shadow-[2px_2px_0px_0px_var(--shadow-color)] transition-all">💢 怒</button>
                                    </div>

                                    <div class="relative inline-block">
                                        <svg class="btn-splat-around absolute -inset-6 w-[calc(100%+48px)] h-[calc(100%+48px)] opacity-0 pointer-events-none transition-all duration-300 scale-50 z-0" viewBox="0 0 160 80" preserveAspectRatio="none">
                                            <path d="M15,20 Q80,5 145,20 Q150,45 130,42 Q115,78 98,48 Q82,78 68,48 Q48,76 30,45 Z" /><line x1="100" y1="48" x2="98" y2="72" stroke-width="3" stroke-linecap="round"/><line x1="70" y1="48" x2="66" y2="74" stroke-width="3" stroke-linecap="round"/>
                                        </svg>
                                        <button type="button" data-mood="😢" onclick="selectMoodStamp(this, '😢')" class="mood-stamp-btn relative z-10 border-3 border-[var(--text-color)] bg-white text-[#2B2D35] px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold shadow-[2px_2px_0px_0px_var(--shadow-color)] transition-all">😢 哀</button>
                                    </div>

                                    <div class="relative inline-block">
                                        <svg class="btn-splat-around absolute -inset-6 w-[calc(100%+48px)] h-[calc(100%+48px)] opacity-0 pointer-events-none transition-all duration-300 scale-50 z-0" viewBox="0 0 160 80" preserveAspectRatio="none">
                                            <path d="M20,30 Q45,-5 75,20 Q110,-10 135,20 Q170,40 138,52 Q115,85 75,58 Q30,85 15,50 Z" /><polygon points="12,15 18,22 10,24" /><polygon points="145,10 152,18 140,20" /><circle cx="152" cy="48" r="4.5" />
                                        </svg>
                                        <button type="button" data-mood="🎉" onclick="selectMoodStamp(this, '🎉')" class="mood-stamp-btn relative z-10 border-3 border-[var(--text-color)] bg-white text-[#2B2D35] px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold shadow-[2px_2px_0px_0px_var(--shadow-color)] transition-all">🎉 乐</button>
                                    </div>

                                    <div class="relative inline-block">
                                        <svg class="btn-splat-around absolute -inset-6 w-[calc(100%+48px)] h-[calc(100%+48px)] opacity-0 pointer-events-none transition-all duration-300 scale-50 z-0" viewBox="0 0 160 80" preserveAspectRatio="none">
                                            <path d="M30,35 C20,15 50,8 70,22 C85,5 115,8 125,28 C145,28 150,52 130,62 C115,74 85,68 70,58 C50,72 22,62 30,35 Z" /><circle cx="50" cy="14" r="2.5" /><circle cx="95" cy="8" r="3" />
                                        </svg>
                                        <button type="button" data-mood="🧠" onclick="selectMoodStamp(this, '🧠')" class="mood-stamp-btn relative z-10 border-3 border-[var(--text-color)] bg-white text-[#2B2D35] px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold shadow-[2px_2px_0px_0px_var(--shadow-color)] transition-all">🧠 思</button>
                                    </div>

                                </div>
                            </div>
                            
                            <div class="sm:col-span-4 flex flex-col space-y-2">
                                <span class="text-[10px] font-mono font-black text-[var(--text-muted)] uppercase">● 更改存储时间:</span>
                                <input id="noteCustomDate" type="date" required class="w-full cel-input rounded-xl px-3 py-2 text-xs font-mono bg-white">
                            </div>
                        </div>

                        <textarea id="noteContent" rows="6" placeholder="在此记录你的点点滴滴..." required class="w-full cel-input rounded-xl px-4 py-3 text-xs font-mono resize-none custom-scrollbar"></textarea>
                        
                        <div class="flex justify-end items-center gap-2 select-none">
                            <button type="button" id="btn-cancel-edit" onclick="cancelEditNote()" class="hidden cel-btn px-4 py-2.5 bg-white text-[#2B2D35] font-bold text-xs rounded-xl shadow-[2px_2px_0px_0px_var(--shadow-color)]">取消编辑</button>
                            <button type="submit" id="btn-submit" class="cel-btn px-6 py-2.5 bg-[var(--ink-main)] text-[#2B2D35] font-bold text-xs rounded-xl shadow-[2px_2px_0px_0px_var(--shadow-color)]">刻录记忆碎片</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- 【第二模块】：历史记忆检索与筛查 -->
            <section id="section-archive" class="cel-card p-4 sm:p-5 flex flex-col">
                <div class="w-full relative pb-4 select-none">
                    <button type="button" onclick="toggleModule('module-archive', 'arrow-archive')" class="w-full flex justify-between items-center font-display font-black text-sm tracking-widest text-left">
                        <span>🔍 MODULE_02 // 历史记忆检索与筛查</span>
                        <span id="arrow-archive" class="transform transition-transform" style="transform: rotate(-90deg);">▼</span>
                    </button>
                    <div class="absolute inset-x-0 bottom-0 h-4 overflow-hidden pointer-events-none select-none mt-2">
                        <svg class="w-full h-full" viewBox="0 0 1000 20" preserveAspectRatio="none">
                            <path class="rainbow-stream-1" d="M0,8 C150,-4 350,24 500,8 C650,-4 850,24 1000,8" fill="none" stroke="#FFB7B2" stroke-width="4.5" stroke-linecap="round"></path>
                            <path class="rainbow-stream-2" d="M0,10 C200,24 400,-4 600,10 C800,24 900,-4 1000,10" fill="none" stroke="#BFFCC6" stroke-width="3.5" stroke-linecap="round"></path>
                            <path class="rainbow-stream-3" d="M0,12 C100,6 250,14 500,12 C750,6 900,14 1000,12" fill="none" stroke="#FFDAC1" stroke-width="4" stroke-linecap="round"></path>
                        </svg>
                    </div>
                </div>
                
                <div id="module-archive" class="module-content collapsed space-y-4 mt-5">
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 bg-[var(--surface-soft)] border-2 border-[var(--text-color)] p-3 rounded-xl select-none">
                        <input id="filterKeyword" type="text" oninput="filterNotes()" placeholder="搜索标题或正文..." class="cel-input rounded-xl px-3 py-2 text-xs font-mono sm:col-span-5">
                        <input id="filterCategory" type="text" oninput="filterNotes()" placeholder="按分类标签筛选..." class="cel-input rounded-xl px-3 py-2 text-xs font-mono sm:col-span-3">
                        <input id="filterDate" type="date" oninput="filterNotes()" class="cel-input rounded-xl px-3 py-2 text-xs font-mono bg-white sm:col-span-3">
                        <button type="button" onclick="resetFilters()" class="cel-btn bg-white text-[#2B2D35] rounded-xl px-2 py-2 text-[10px] font-mono font-black sm:col-span-1">重置</button>
                    </div>
                    <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[460px] overflow-y-auto custom-scrollbar pr-1"></div>
                </div>
            </section>

            <!-- 【第三模块】：记忆墨水罐 -->
            <section class="cel-card p-4 sm:p-5 flex flex-col">
                <div class="w-full relative pb-4 select-none">
                    <button type="button" onclick="toggleModule('module-analytics', 'arrow-analytics')" class="w-full flex justify-between items-center font-display font-black text-sm tracking-widest text-left">
                        <span>🚀 MODULE_03 // 记忆墨水罐</span>
                        <span id="arrow-analytics" class="transform transition-transform" style="transform: rotate(-90deg);">▼</span>
                    </button>
                    <div class="absolute inset-x-0 bottom-0 h-4 overflow-hidden pointer-events-none select-none mt-2">
                        <svg class="w-full h-full" viewBox="0 0 1000 20" preserveAspectRatio="none">
                            <path class="rainbow-stream-1" d="M0,8 C150,-4 350,24 500,8 C650,-4 850,24 1000,8" fill="none" stroke="#FFB7B2" stroke-width="4.5" stroke-linecap="round"></path>
                            <path class="rainbow-stream-2" d="M0,10 C200,24 400,-4 600,10 C800,24 900,-4 1000,10" fill="none" stroke="#BFFCC6" stroke-width="3.5" stroke-linecap="round"></path>
                            <path class="rainbow-stream-3" d="M0,12 C100,6 250,14 500,12 C750,6 900,14 1000,12" fill="none" stroke="#FFDAC1" stroke-width="4" stroke-linecap="round"></path>
                        </svg>
                    </div>
                </div>
                
                <div id="module-analytics" class="module-content collapsed grid grid-cols-1 md:grid-cols-12 gap-6 mt-5">
                    <div id="inkTankContainer" onclick="shakeAndDiveTank(this)" class="md:col-span-4 border-2 border-[var(--text-color)] p-4 rounded-xl flex flex-col items-center justify-center bg-[var(--surface-soft)] select-none cursor-pointer transform hover:scale-[1.02] transition-transform relative group">
                        <div class="absolute top-1.5 text-[8px] font-mono font-black text-slate-500 bg-white border border-black px-1.5 py-0.5 rounded shadow-[1px_1px_0px_0px_#000] opacity-0 group-hover:opacity-100 transition-opacity uppercase">点击潜水</div>
                        
                        <p class="text-[10px] font-mono font-black mb-3 mt-2 text-[var(--text-muted)]">INK TANK CAPACITY // 墨水罐</p>
                        
                        <div id="inkTankFrame" class="relative w-16 h-36 border-4 border-[var(--text-color)] rounded-b-xl rounded-t-md bg-stone-200 overflow-hidden shadow-[2px_2px_0px_0px_var(--shadow-color)]">
                            <div id="inkFluidLevel" class="absolute bottom-0 inset-x-0 bg-[var(--ink-main)] transition-all duration-500 origin-bottom" style="height: 20%;"></div>
                            <span id="tankSquid" class="absolute left-1/2 bottom-0 text-2xl z-20 opacity-0 pointer-events-none select-none">🦑</span>
                            <div class="absolute inset-y-0 right-1 flex flex-col justify-between text-[8px] font-mono font-black text-black opacity-35 select-none">
                                <span>-100</span><span>-75</span><span>-50</span><span>-25</span><span>-0</span>
                            </div>
                        </div>
                        <span id="txtInkPercent" class="font-mono text-xs font-black mt-3 text-[var(--text-color)]">0 篇 · 10%</span>
                    </div>

                    <div class="md:col-span-8 border-2 border-[var(--text-color)] p-4 rounded-xl flex flex-col justify-between bg-[var(--surface-soft)]">
                        <div class="select-none">
                            <p class="text-[10px] font-mono font-black mb-2 text-[var(--text-muted)] uppercase">自选频段标签聚集地</p>
                            <div id="tagCloudContainer" class="flex flex-wrap gap-2 pt-2"></div>
                        </div>
                        <div class="border-t border-dashed border-[var(--text-color)]/25 pt-3 mt-4 text-[10px] font-mono text-[var(--text-muted)] select-none">
                            数据提取规则: 点击上方标签，会自动展开并定位到 MODULE_02 过滤出对应记事。
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <!-- 丰富版 DIY 控制台 -->
        <section id="studioDrawer" class="w-full mt-4 select-none">
            <button type="button" onclick="toggleStudioDrawer()" class="cel-card w-full p-3 font-bold text-xs flex items-center justify-between hover:opacity-95 transition-opacity">
                <div class="flex items-center space-x-2">
                    <span>🦑</span> <span>DIY 喷漆色调与画布控制台 (点击展开/折叠)</span>
                </div>
                <span id="drawerArrow" class="transform transition-transform duration-300">▲</span>
            </button>
            <div id="drawerContent" class="hidden mt-3 cel-card p-4 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <p class="text-[11px] font-mono font-bold text-[var(--text-muted)] mb-2">● 墨水罐填充色素 + 自定义取色</p>
                        <div class="grid grid-cols-3 gap-2 mb-2.5">
                            <button type="button" id="p-m1" onclick="changeInkPalette('m1','#A3B5C0')" class="border-2 border-slate-300 px-2 py-1.5 bg-[#A3B5C0] text-black rounded-xl text-xs font-bold">冰川蓝</button>
                            <button type="button" id="p-m2" onclick="changeInkPalette('m2','#C2B4A6')" class="border-2 border-slate-300 px-2 py-1.5 bg-[#C2B4A6] text-black rounded-xl text-xs font-bold">晚霞驼</button>
                            <button type="button" id="p-m3" onclick="changeInkPalette('m3','#B9C0A4')" class="border-2 border-slate-300 px-2 py-1.5 bg-[#B9C0A4] text-black rounded-xl text-xs font-bold">苍山绿</button>
                        </div>
                        <div class="flex items-center gap-3 text-[11px] font-mono">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <span>自定义底色</span>
                                <input id="customBgPicker" type="color" value="#F4F2EC" onchange="applyCustomBg(this.value)" class="w-7 h-7 rounded-lg border-2 border-[var(--text-color)] cursor-pointer bg-transparent">
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <span>自定义墨水色</span>
                                <input id="customInkPicker" type="color" value="#FF85A2" onchange="applyCustomInk(this.value)" class="w-7 h-7 rounded-lg border-2 border-[var(--text-color)] cursor-pointer bg-transparent">
                            </label>
                        </div>
                    </div>
                    <div>
                        <p class="text-[11px] font-mono font-bold text-[var(--text-muted)] mb-2">● 切换底层画布覆盖样式（5种）</p>
                        <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
                            <button type="button" onclick="changePatternStyle('dots')" id="pattern-btn-dots" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-xs font-bold">圆点</button>
                            <button type="button" onclick="changePatternStyle('grid')" id="pattern-btn-grid" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-xs font-bold">方格</button>
                            <button type="button" onclick="changePatternStyle('stripes')" id="pattern-btn-stripes" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-xs font-bold">斜纹</button>
                            <button type="button" onclick="changePatternStyle('lines')" id="pattern-btn-lines" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-xs font-bold">横线</button>
                            <button type="button" onclick="changePatternStyle('none')" id="pattern-btn-none" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-xs font-bold">空白</button>
                        </div>
                    </div>
                    <div>
                        <p class="text-[11px] font-mono font-bold text-[var(--text-muted)] mb-2">● 卡片圆角 & 阴影厚度</p>
                        <div class="grid grid-cols-3 gap-2 mb-2">
                            <button type="button" onclick="changeRadius('28px')" id="rad-28px" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-xs font-bold">果冻圆角</button>
                            <button type="button" onclick="changeRadius('16px')" id="rad-16px" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-xs font-bold">标准手账</button>
                            <button type="button" onclick="changeRadius('4px')" id="rad-4px" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-xs font-bold">硬核像素</button>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            <button type="button" onclick="changeShadow('0px')" id="shd-0px" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-[11px] font-bold">扁平</button>
                            <button type="button" onclick="changeShadow('3px')" id="shd-3px" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-[11px] font-bold">轻盈</button>
                            <button type="button" onclick="changeShadow('5px')" id="shd-5px" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-[11px] font-bold">标准</button>
                            <button type="button" onclick="changeShadow('9px')" id="shd-9px" class="border-2 border-slate-300 py-1.5 bg-[var(--card-bg)] rounded-xl text-[11px] font-bold">厚重</button>
                        </div>
                    </div>
                    <div>
                        <p class="text-[11px] font-mono font-bold text-[var(--text-muted)] mb-2">● 背景喷漆交互</p>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" onclick="toggleSplatFx(true)" id="splat-on" class="border-2 border-slate-300 py-2 bg-[var(--card-bg)] rounded-xl text-xs font-bold">喷漆水花：开</button>
                            <button type="button" onclick="toggleSplatFx(false)" id="splat-off" class="border-2 border-slate-300 py-2 bg-[var(--card-bg)] rounded-xl text-xs font-bold">喷漆水花：关</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('eris_cel_notes')) || [];
        let currentPattern = localStorage.getItem('eris_cel_pattern') || 'dots';
        let currentRadius = localStorage.getItem('eris_cel_radius') || '18px';
        let currentShadow = localStorage.getItem('eris_cel_shadow') || '5px';
        let splatEnabled = localStorage.getItem('eris_cel_fx') !== 'off';
        let soundActive = localStorage.getItem('eris_cel_sound') !== 'false';
        let activeStamp = '😄';
        let currentMoodColor = '#FF85A2';
        let editingNoteId = null;
        let isDrawerOpen = false;

        const moodColorMap = {
            '😄': '#FF85A2',
            '💢': '#FF4D4D',
            '😢': '#4D96FF',
            '🎉': '#FFD93D',
            '🧠': '#B388FF'
        };

        document.getElementById('noteCustomDate').value = new Date().toISOString().substring(0, 10);

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
        }

        function applySharedBasePalette() {
            const shared = localStorage.getItem('eris_cel_palette');
            const root = document.documentElement;
            if (shared === 'monochrome') {
                root.style.setProperty('--bg-color', '#131824');
                root.style.setProperty('--text-color', '#FFFDF6');
                root.style.setProperty('--text-muted', '#94A1B8');
                root.style.setProperty('--card-bg', '#1E2638');
                root.style.setProperty('--surface-soft', '#171E2E');
                root.style.setProperty('--shadow-color', '#070A10');
                document.getElementById('customBgPicker').value = '#131824';
            } else if (shared === 'custom') {
                const bg = localStorage.getItem('eris_cel_custom_bg');
                if (bg) { root.style.setProperty('--bg-color', bg); document.getElementById('customBgPicker').value = bg; }
            }
        }

        function selectMoodStamp(btn, emoji, silent = false) {
            document.querySelectorAll('.mood-stamp-btn').forEach(b => {
                b.style.transform = '';
                b.style.boxShadow = '2px 2px 0px 0px var(--shadow-color)';
                const splat = b.parentElement.querySelector('.btn-splat-around');
                if (splat) { splat.style.opacity = '0'; splat.style.transform = 'scale(0.5)'; }
            });
            
            currentMoodColor = moodColorMap[emoji] || '#FF85A2';
            document.documentElement.style.setProperty('--ink-main', currentMoodColor);
            document.getElementById('customInkPicker').value = currentMoodColor;
            
            const randRotate = (Math.random() * 6 - 3);
            btn.style.transform = `scale(1.12) rotate(${randRotate}deg)`;
            btn.style.boxShadow = '4px 4px 0px 0px var(--shadow-color)';
            
            const splat = btn.parentElement.querySelector('.btn-splat-around');
            if (splat) {
                splat.style.opacity = '0.95';
                splat.style.transform = 'scale(1)';
                splat.querySelectorAll('path, circle, polygon').forEach(el => { el.style.fill = currentMoodColor; });
                splat.querySelectorAll('line').forEach(el => { el.style.stroke = currentMoodColor; });
            }
            
            activeStamp = emoji;
            updateAnalytics();
            if (!silent) playSquishBleep(true);
        }

        let isTankAnimating = false;
        function shakeAndDiveTank(container) {
            if (isTankAnimating) return;
            isTankAnimating = true;
            playSquishBleep(true);
            
            const frame = document.getElementById('inkTankFrame');
            const squid = document.getElementById('tankSquid');
            frame.classList.add('tank-shake-active');
            squid.style.color = currentMoodColor;
            squid.classList.add('squid-leap-active');
            
            const rect = container.getBoundingClientRect();
            setTimeout(() => {
                for (let i = 0; i < 4; i++) {
                    let dropX = rect.left + 30 + (Math.random() * 160 - 80);
                    let dropY = rect.top - 40 - (Math.random() * 80);
                    splats.push(new InkSplat(dropX, dropY, currentMoodColor));
                }
            }, 200);

            setTimeout(() => {
                frame.classList.remove('tank-shake-active');
                squid.classList.remove('squid-leap-active');
                isTankAnimating = false;
            }, 760);
        }

        function openModule(id, arrowId) {
            const el = document.getElementById(id);
            const arrow = document.getElementById(arrowId);
            if (el && el.classList.contains('collapsed')) {
                el.classList.remove('collapsed');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            }
        }

        function toggleModule(id, arrowId) {
            const el = document.getElementById(id);
            const arrow = document.getElementById(arrowId);
            el.classList.toggle('collapsed');
            if (el.classList.contains('collapsed')) { arrow.style.transform = 'rotate(-90deg)'; } 
            else { arrow.style.transform = 'rotate(0deg)'; }
            playSquishBleep(false);
        }

        function resetFilters() {
            document.getElementById('filterKeyword').value = '';
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterDate').value = '';
            filterNotes();
            playSquishBleep(false);
        }

        function filterNotes() {
            const kw = document.getElementById('filterKeyword').value.trim().toLowerCase();
            const catKeyword = document.getElementById('filterCategory').value.trim().toLowerCase();
            const dateKeyword = document.getElementById('filterDate').value;
            renderNotes(kw, catKeyword, dateKeyword);
        }

        function renderNotes(filterKw = '', filterCat = '', filterDate = '') {
            const container = document.getElementById('notesGrid');
            container.innerHTML = '';

            let filtered = notes.filter(note => {
                const matchKw = !filterKw || (note.title && note.title.toLowerCase().includes(filterKw)) || (note.content && note.content.toLowerCase().includes(filterKw));
                const matchCat = !filterCat || (note.category && note.category.toLowerCase().includes(filterCat));
                const matchDate = !filterDate || (note.date === filterDate);
                return matchKw && matchCat && matchDate;
            });

            filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 font-mono text-xs text-[var(--text-muted)] border-2 border-dashed border-[var(--text-color)] rounded-xl bg-[var(--surface-soft)]">没有找到匹配检索条件的手账。</div>`;
                updateAnalytics();
                return;
            }

            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = `cel-card p-4 flex flex-col justify-between bg-[var(--card-bg)] border-3 border-[var(--text-color)] shadow-[3px_3px_0px_0px_var(--shadow-color)] ${note.pinned ? 'ring-2 ring-[var(--ink-main)]' : ''}`;
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center border-b-2 border-[var(--text-color)] pb-2 mb-2 gap-2">
                            <div class="flex items-center space-x-2 min-w-0">
                                <span class="w-9 h-9 shrink-0 flex items-center justify-center text-lg bg-white border-2 border-[var(--text-color)] rounded-xl shadow-[1.5px_1.5px_0px_0px_var(--shadow-color)]">${note.stamp || '📌'}</span>
                                <div class="min-w-0">
                                    <h3 class="font-display font-black text-xs sm:text-sm text-[var(--text-color)] truncate">${note.pinned ? '📌 ' : ''}${escapeHtml(note.title)}</h3>
                                    <span class="inline-block text-[9px] font-mono px-1.5 py-0.5 bg-[var(--accent-third)] border border-black rounded text-[#2B2D35] font-bold mt-0.5"># ${escapeHtml(note.category || '未分类')}</span>
                                </div>
                            </div>
                            <span class="font-mono text-[9px] text-[var(--text-muted)] font-black shrink-0">${escapeHtml(note.date)}</span>
                        </div>
                        <p class="text-xs font-mono font-semibold leading-relaxed text-[var(--text-muted)] whitespace-pre-wrap break-all">${escapeHtml(note.content)}</p>
                    </div>
                    <div class="mt-4 pt-2 border-t-2 border-dashed border-[var(--text-color)]/15 flex justify-end gap-1.5">
                        <button type="button" onclick="togglePinNote(${note.id})" class="font-display font-black text-[10px] border-2 border-[var(--text-color)] ${note.pinned ? 'bg-[var(--ink-main)]' : 'bg-white'} text-[#2B2D35] px-2 py-1 rounded-lg shadow-[1px_1px_0px_0px_var(--shadow-color)] transition-colors">${note.pinned ? '取消置顶' : '置顶'}</button>
                        <button type="button" onclick="startEditNote(${note.id})" class="font-display font-black text-[10px] border-2 border-[var(--text-color)] bg-[#FFDAC1] text-[#2B2D35] px-2 py-1 rounded-lg shadow-[1px_1px_0px_0px_var(--shadow-color)] transition-colors">编辑</button>
                        <button type="button" onclick="deleteNote(${note.id})" class="font-display font-black text-[10px] border-2 border-[var(--text-color)] bg-white text-[#2B2D35] px-2.5 py-1 rounded-lg shadow-[1px_1px_0px_0px_var(--shadow-color)] hover:bg-black hover:text-white transition-colors">删除</button>
                    </div>
                `;
                container.appendChild(card);
            });
            updateAnalytics();
        }

        function updateAnalytics() {
            const tankPercent = Math.min(100, Math.max(10, Math.floor((notes.length / 10) * 100)));
            const levelNode = document.getElementById('inkFluidLevel');
            if (levelNode) {
                levelNode.style.height = `${tankPercent}%`;
                levelNode.style.backgroundColor = currentMoodColor;
            }
            document.getElementById('txtInkPercent').textContent = `${notes.length} 篇 · ${tankPercent}%`;

            const cloud = document.getElementById('tagCloudContainer');
            cloud.innerHTML = '';
            const categories = [...new Set(notes.map(n => n.category).filter(Boolean))];
            if (categories.length === 0) {
                cloud.innerHTML = `<span class="text-xs font-mono text-slate-400">目前暂无手写频段</span>`;
                return;
            }
            categories.forEach(cat => {
                const badge = document.createElement('button');
                badge.type = 'button';
                badge.className = "tag-pill text-xs font-mono font-black border-2 border-[var(--text-color)] bg-white text-[#2B2D35] px-2.5 py-1 rounded-xl shadow-[2px_2px_0px_0px_var(--shadow-color)] cursor-pointer transition-colors";
                badge.textContent = `⚡ ${cat}`;
                badge.onclick = () => {
                    document.getElementById('filterCategory').value = cat;
                    openModule('module-archive', 'arrow-archive');
                    filterNotes();
                    document.getElementById('section-archive').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    playSquishBleep(false);
                };
                cloud.appendChild(badge);
            });
        }

        function togglePinNote(id) {
            notes = notes.map(n => n.id === id ? { ...n, pinned: !n.pinned } : n);
            localStorage.setItem('eris_cel_notes', JSON.stringify(notes));
            filterNotes();
            playSquishBleep(false);
        }

        function startEditNote(id) {
            const target = notes.find(n => n.id === id);
            if (!target) return;
            editingNoteId = id;
            document.getElementById('noteTitle').value = target.title || '';
            document.getElementById('noteCustomCategory').value = target.category || '';
            document.getElementById('noteCustomDate').value = target.date || new Date().toISOString().substring(0, 10);
            document.getElementById('noteContent').value = target.content || '';
            const moodBtn = document.querySelector(`.mood-stamp-btn[data-mood="${target.stamp}"]`);
            if (moodBtn) selectMoodStamp(moodBtn, target.stamp, true);

            document.getElementById('btn-submit').textContent = '保存修改';
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            openModule('module-create', 'arrow-create');
            document.getElementById('section-create').scrollIntoView({ behavior: 'smooth', block: 'start' });
            playSquishBleep(false);
        }

        function cancelEditNote() {
            editingNoteId = null;
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteCustomCategory').value = '';
            document.getElementById('noteCustomDate').value = new Date().toISOString().substring(0, 10);
            document.getElementById('noteContent').value = '';
            document.getElementById('btn-submit').textContent = '刻录记忆碎片';
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        }

        document.getElementById('noteForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('noteTitle');
            const customCat = document.getElementById('noteCustomCategory');
            const customDate = document.getElementById('noteCustomDate');
            const content = document.getElementById('noteContent');

            if (editingNoteId !== null) {
                notes = notes.map(n => n.id === editingNoteId ? {
                    ...n,
                    title: title.value.trim(),
                    stamp: activeStamp,
                    category: customCat.value.trim(),
                    date: customDate.value,
                    content: content.value.trim()
                } : n);
                cancelEditNote();
            } else {
                notes.unshift({
                    id: Date.now(),
                    title: title.value.trim(),
                    stamp: activeStamp,
                    category: customCat.value.trim(),
                    date: customDate.value,
                    content: content.value.trim(),
                    pinned: false
                });
                title.value = '';
                content.value = '';
                customCat.value = '';
            }

            localStorage.setItem('eris_cel_notes', JSON.stringify(notes));
            openModule('module-archive', 'arrow-archive');
            filterNotes();
            playSquishBleep(true);
        });

        function deleteNote(id) {
            if (editingNoteId === id) cancelEditNote();
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('eris_cel_notes', JSON.stringify(notes));
            filterNotes();
            playSquishBleep(false);
        }

        function exportNotesMarkdown() {
            if (notes.length === 0) return;
            const md = notes.map(n => `## ${n.stamp || ''} ${n.title}\n- **日期**: ${n.date}\n- **标签**: #${n.category || '未分类'}\n\n${n.content}\n`).join('\n---\n\n');
            const blob = new Blob([`# ERIS 记事本存档\n\n${md}`], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `eris-notebook-${new Date().toISOString().slice(0, 10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
            playSquishBleep(true);
        }

        function toggleStudioDrawer() {
            isDrawerOpen = !isDrawerOpen;
            const content = document.getElementById('drawerContent');
            const arrow = document.getElementById('drawerArrow');
            if (isDrawerOpen) { content.classList.remove('hidden'); arrow.textContent = '▼'; } 
            else { content.classList.add('hidden'); arrow.textContent = '▲'; }
            playSquishBleep(false);
        }

        function changeInkPalette(type, colorHex, silent = false) {
            localStorage.setItem('eris_cel_palette_note', type);
            currentMoodColor = colorHex;
            document.documentElement.style.setProperty('--ink-main', colorHex);
            document.getElementById('customInkPicker').value = colorHex;
            document.querySelectorAll('[id^="p-"]').forEach(btn => btn.classList.remove('active-option'));
            const act = document.getElementById(`p-${type}`);
            if (act) act.classList.add('active-option');
            updateAnalytics();
            if (!silent) playSquishBleep(false);
        }

        function applyCustomBg(val) {
            document.documentElement.style.setProperty('--bg-color', val);
            localStorage.setItem('eris_cel_palette', 'custom');
            localStorage.setItem('eris_cel_custom_bg', val);
            playSquishBleep(false);
        }

        function applyCustomInk(val) {
            currentMoodColor = val;
            document.documentElement.style.setProperty('--ink-main', val);
            document.querySelectorAll('[id^="p-"]').forEach(btn => btn.classList.remove('active-option'));
            updateAnalytics();
            playSquishBleep(false);
        }

        function changePatternStyle(pattern, silent = false) {
            currentPattern = pattern;
            localStorage.setItem('eris_cel_pattern', pattern);
            const body = document.getElementById('canvasBody');
            body.classList.remove('pattern-dots', 'pattern-grid', 'pattern-stripes', 'pattern-lines', 'pattern-none');
            body.classList.add(`pattern-${pattern}`);
            document.querySelectorAll('[id^="pattern-btn-"]').forEach(btn => btn.classList.remove('active-option'));
            const act = document.getElementById(`pattern-btn-${pattern}`);
            if (act) act.classList.add('active-option');
            if (!silent) playSquishBleep(false);
        }

        function changeRadius(rad, silent = false) {
            currentRadius = rad;
            localStorage.setItem('eris_cel_radius', rad);
            document.documentElement.style.setProperty('--card-radius', rad);
            document.querySelectorAll('[id^="rad-"]').forEach(btn => btn.classList.remove('active-option'));
            const act = document.getElementById(`rad-${rad}`);
            if (act) act.classList.add('active-option');
            if (!silent) playSquishBleep(false);
        }

        function changeShadow(shd, silent = false) {
            currentShadow = shd;
            localStorage.setItem('eris_cel_shadow', shd);
            document.documentElement.style.setProperty('--shadow-offset', shd);
            document.querySelectorAll('[id^="shd-"]').forEach(btn => btn.classList.remove('active-option'));
            const act = document.getElementById(`shd-${shd}`);
            if (act) act.classList.add('active-option');
            if (!silent) playSquishBleep(false);
        }

        function toggleSplatFx(enabled, silent = false) {
            splatEnabled = enabled;
            localStorage.setItem('eris_cel_fx', enabled ? 'random' : 'off');
            document.getElementById('splat-on').classList.toggle('active-option', enabled);
            document.getElementById('splat-off').classList.toggle('active-option', !enabled);
            if (!silent) playSquishBleep(false);
        }

        // --- AUDIO ENGINE ---
        let audioCtx = null;
        const soundToggleBtn = document.getElementById('soundToggle');
        const soundStatusSpan = document.getElementById('soundStatus');

        function syncSoundUI() {
            if (soundActive) { soundStatusSpan.textContent = 'SFX: ON'; soundToggleBtn.style.opacity = '1'; soundToggleBtn.classList.remove('sound-muted'); }
            else { soundStatusSpan.textContent = 'SFX: OFF'; soundToggleBtn.style.opacity = '0.6'; soundToggleBtn.classList.add('sound-muted'); }
        }

        soundToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundActive = !soundActive;
            localStorage.setItem('eris_cel_sound', soundActive);
            syncSoundUI();
            if (soundActive) playSquishBleep(false);
        });

        function playSquishBleep(isSpecial = false) {
            if (!soundActive) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(isSpecial ? 490 : 310, now);
                osc.frequency.exponentialRampToValueAtTime(65, now + 0.16);
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.06, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.18);
            } catch (e) {}
        }

        // --- 斯普拉遁核心慢速墨水粒子引擎 ---
        const canvas = document.getElementById('splatCanvas');
        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;
        let splats = [];

        function initCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        class InkSplat {
            constructor(x, y, customColor = null) {
                this.x = x; this.y = y; this.radius = 0; this.maxRadius = Math.random() * 20 + 22;
                this.opacity = 0.95; this.growthSpeed = 1.2;
                const splatColors = ['#C2B4A6', '#A3B5C0', '#B9C0A4', '#D0C4DF', '#C1CDCD', '#E2D3C4']; 
                this.color = customColor ? customColor : splatColors[Math.floor(Math.random() * splatColors.length)];
                this.drops = [];
                let dropCount = Math.floor(Math.random() * 4) + 5;
                for (let i = 0; i < dropCount; i++) {
                    let angle = (i / dropCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
                    let targetDist = Math.random() * 38 + 24;
                    this.drops.push({ cx: 0, cy: 0, tx: Math.cos(angle) * targetDist, ty: Math.sin(angle) * targetDist, r: 0, mr: Math.random() * 4.5 + 3 });
                }
            }
            update() {
                if (this.radius < this.maxRadius) this.radius += this.growthSpeed;
                this.drops.forEach(d => { d.cx += (d.tx - d.cx) * 0.05; d.cy += (d.ty - d.cy) * 0.05; if (d.r < d.mr) d.r += this.growthSpeed * 0.12; });
                if (this.radius >= this.maxRadius) this.opacity -= 0.003;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.opacity); ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                this.drops.forEach(d => {
                    ctx.beginPath(); ctx.arc(this.x + d.cx, this.y + d.cy, d.r, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.strokeStyle = this.color; ctx.lineWidth = d.r * 0.4;
                    ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + d.cx, this.y + d.cy); ctx.stroke();
                });
                ctx.restore();
            }
        }

        window.addEventListener('mousedown', (e) => {
            if (!splatEnabled) return;
            if (e.target.closest('header') || e.target.closest('main') || e.target.closest('button') || e.target.closest('section') || e.target.closest('a') || e.target.closest('input') || e.target.closest('textarea')) return;
            playSquishBleep(false);
            splats.push(new InkSplat(e.clientX, e.clientY));
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
            splats = splats.filter(s => s.opacity > 0);
            splats.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }

        applySharedBasePalette();
        changePatternStyle(currentPattern, true);
        changeRadius(currentRadius, true);
        changeShadow(currentShadow, true);
        toggleSplatFx(splatEnabled, true);
        syncSoundUI();
        filterNotes();
        initCanvas();
        animate();

        const initialActiveBtn = document.querySelector('.mood-stamp-btn');
        if (initialActiveBtn) selectMoodStamp(initialActiveBtn, '😄', true);

        window.addEventListener('resize', initCanvas);
    </script>
</body>
</html>
