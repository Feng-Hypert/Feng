name: Rename banner to banner-110.jpg
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename banner file
        run: |
          git config user.name "Feng-Hypert"
          git config user.email "Feng-Hypert@users.noreply.github.com"
          git mv shots/Gemini_Generated_Image_kjthj0kjthj0kjth.jpg shots/banner-110.jpg
          git commit -m "Rename Gemini_Generated_Image_kjthj0kjthj0kjth.jpg to banner-110.jpg"
          git push
