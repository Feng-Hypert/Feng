              private static RemoteViews buildViews(Context context) {
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.feng_widget);
                  SharedPreferences sp = context.getSharedPreferences(MainActivity.WIDGET_PREF_NAME, Context.MODE_PRIVATE);
                  boolean hasData = sp.getBoolean("w_has_data", false);
                  String title = sp.getString("w_title", "");
                  String artist = sp.getString("w_artist", "");
                  String album = sp.getString("w_album", "");
                  boolean isPlaying = sp.getBoolean("w_playing", false);
                  float elapsed = sp.getFloat("w_elapsed", 0f);
                  float duration = sp.getFloat("w_duration", 0f);

                  boolean hasLive = hasData && title != null && !title.isEmpty() && !"FENG MUSIC".equals(title);

                  if (hasLive) {
                      views.setViewVisibility(R.id.widget_live_meta, View.VISIBLE);
