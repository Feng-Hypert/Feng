              private static Bitmap renderCoverWithPeekingVinyl(Context context, Bitmap rawCover, boolean isPlaying) {
                  try {
                      int w = 310;
                      int h = 240;
                      int coverSize = 224;
                      int topY = (h - coverSize) / 2;
                      float cornerR = 54f;

                      Bitmap out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      Canvas canvas = new Canvas(out);
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);

                      float vinylR = 102f;
                      float vinylCx = isPlaying ? 198f : 158f;
                      float vinylCy = h * 0.5f;

                      p.setShader(new RadialGradient(
                          vinylCx, vinylCy, vinylR,
                          new int[]{Color.parseColor("#2A2F3A"), Color.parseColor("#111319"), Color.parseColor("#08090D")},
                          new float[]{0.15f, 0.65f, 1.0f},
                          Shader.TileMode.CLAMP
                      ));
                      canvas.drawCircle(vinylCx, vinylCy, vinylR, p);
                      p.setShader(null);

                      Paint groove = new Paint(Paint.ANTI_ALIAS_FLAG);
                      groove.setStyle(Paint.Style.STROKE);
                      groove.setStrokeWidth(1.2f);
                      groove.setColor(Color.argb(36, 255, 255, 255));
                      for (float r = 46f; r <= 94f; r += 9f) {
                          canvas.drawCircle(vinylCx, vinylCy, r, groove);
                      }

                      Paint hub = new Paint(Paint.ANTI_ALIAS_FLAG);
                      hub.setColor(isPlaying ? Color.parseColor("#42E6D9") : Color.parseColor("#47C7FF"));
                      canvas.drawCircle(vinylCx, vinylCy, 26f, hub);
                      hub.setColor(Color.parseColor("#0B0E16"));
                      canvas.drawCircle(vinylCx, vinylCy, 9f, hub);

                      groove.setStrokeWidth(2.0f);
                      groove.setColor(Color.argb(72, 255, 255, 255));
                      canvas.drawCircle(vinylCx, vinylCy, vinylR - 1f, groove);

                      RectF coverRect = new RectF(4f, topY, 4f + coverSize, topY + coverSize);
                      if (rawCover != null) {
                          int sw = rawCover.getWidth();
                          int sh = rawCover.getHeight();
                          int side = Math.min(sw, sh);
                          Bitmap sq = Bitmap.createBitmap(rawCover, (sw - side) / 2, (sh - side) / 2, side, side);
                          Bitmap scaled = Bitmap.createScaledBitmap(sq, coverSize, coverSize, true);
                          if (sq != rawCover) sq.recycle();

                          Paint coverPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                          BitmapShader shader = new BitmapShader(scaled, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP);
                          android.graphics.Matrix mat = new android.graphics.Matrix();
                          mat.setTranslate(coverRect.left, coverRect.top);
                          shader.setLocalMatrix(mat);
                          coverPaint.setShader(shader);
                          canvas.drawRoundRect(coverRect, cornerR, cornerR, coverPaint);
                          scaled.recycle();
                      } else {
                          Paint fallback = new Paint(Paint.ANTI_ALIAS_FLAG);
                          fallback.setColor(Color.parseColor("#182235"));
                          canvas.drawRoundRect(coverRect, cornerR, cornerR, fallback);
                      }

                      Paint rim = new Paint(Paint.ANTI_ALIAS_FLAG);
                      rim.setStyle(Paint.Style.STROKE);
                      rim.setStrokeWidth(2.6f);
                      rim.setShader(new LinearGradient(
                          coverRect.left, coverRect.top, coverRect.right, coverRect.bottom,
                          new int[]{Color.argb(210, 255, 255, 255), Color.argb(55, 255, 255, 255), Color.argb(130, 255, 255, 255)},
                          new float[]{0f, 0.5f, 1f},
                          Shader.TileMode.CLAMP
                      ));
                      canvas.drawRoundRect(coverRect, cornerR, cornerR, rim);
                      return out;
                  } catch (Exception ignored) {
                      return null;
                  }
              }

              private static Bitmap renderAdaptiveLiquidBackground(Context context, Bitmap rawCover, boolean hasLive) {
                  try {
                      int w = 520;
                      int h = 240;
                      float radius = 52f;
                      Bitmap out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      Canvas canvas = new Canvas(out);
                      RectF bounds = new RectF(0f, 0f, w, h);

                      android.graphics.Path clip = new android.graphics.Path();
                      clip.addRoundRect(bounds, radius, radius, android.graphics.Path.Direction.CW);
                      canvas.save();
                      canvas.clipPath(clip);

                      if (hasLive && rawCover != null) {
                          Bitmap tiny = Bitmap.createScaledBitmap(rawCover, 14, 14, true);
                          Bitmap soft = Bitmap.createScaledBitmap(tiny, w, h, true);
                          tiny.recycle();
                          canvas.drawBitmap(soft, 0f, 0f, new Paint(Paint.FILTER_BITMAP_FLAG));
                          soft.recycle();

                          Paint scrim = new Paint(Paint.ANTI_ALIAS_FLAG);
                          scrim.setShader(new LinearGradient(
                              0f, 0f, w, h,
                              new int[]{Color.argb(150, 10, 16, 28), Color.argb(185, 8, 13, 24)},
                              null,
                              Shader.TileMode.CLAMP
                          ));
                          canvas.drawRect(bounds, scrim);
                      } else {
                          Paint idleBg = new Paint(Paint.ANTI_ALIAS_FLAG);
                          idleBg.setShader(new LinearGradient(
                              0f, 0f, w, h,
                              new int[]{Color.parseColor("#0B1626"), Color.parseColor("#13263E"), Color.parseColor("#0A1220")},
                              new float[]{0f, 0.52f, 1f},
                              Shader.TileMode.CLAMP
                          ));
                          canvas.drawRect(bounds, idleBg);
                      }

                      Paint sheen = new Paint(Paint.ANTI_ALIAS_FLAG);
                      sheen.setShader(new RadialGradient(
                          w * 0.22f, h * 0.10f, w * 0.65f,
                          new int[]{Color.argb(42, 255, 255, 255), Color.argb(0, 255, 255, 255)},
                          null,
                          Shader.TileMode.CLAMP
                      ));
                      canvas.drawRect(bounds, sheen);
                      canvas.restore();

                      Paint border = new Paint(Paint.ANTI_ALIAS_FLAG);
                      border.setStyle(Paint.Style.STROKE);
                      border.setStrokeWidth(2.2f);
                      border.setShader(new LinearGradient(
                          0f, 0f, w, h,
                          new int[]{Color.argb(145, 255, 255, 255), Color.argb(38, 255, 255, 255), Color.argb(95, 255, 255, 255)},
                          new float[]{0f, 0.5f, 1f},
                          Shader.TileMode.CLAMP
                      ));
                      canvas.drawRoundRect(new RectF(1.2f, 1.2f, w - 1.2f, h - 1.2f), radius, radius, border);
                      return out;
                  } catch (Exception ignored) {
                      return null;
                  }
              }
          }
