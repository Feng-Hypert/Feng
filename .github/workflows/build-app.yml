              private static Bitmap loadRawCoverBitmap(Context context) {
                  try {
                      File f = new File(context.getFilesDir(), MainActivity.WIDGET_COVER_FILE);
                      if (f.exists() && f.length() > 0) {
                          BitmapFactory.Options opts = new BitmapFactory.Options();
                          opts.inJustDecodeBounds = true;
                          BitmapFactory.decodeFile(f.getAbsolutePath(), opts);
                          int maxDim = Math.max(opts.outWidth, opts.outHeight);
                          int sample = 1;
                          while (maxDim / sample > 360) sample *= 2;
                          BitmapFactory.Options decodeOpts = new BitmapFactory.Options();
                          decodeOpts.inSampleSize = sample;
                          Bitmap b = BitmapFactory.decodeFile(f.getAbsolutePath(), decodeOpts);
                          if (b != null) return b;
                      }
                  } catch (Exception ignored) {}
                  try {
                      return BitmapFactory.decodeResource(context.getResources(), R.mipmap.ic_launcher);
                  } catch (Exception ignored) {
