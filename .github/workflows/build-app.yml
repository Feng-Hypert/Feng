      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FENG_MUSIC_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Capacitor iOS
        run: |
          mkdir -p www
          cp radio.html www/index.html
          cp icon-512.png www/icon-512.png
          sed -i '' 's|"/icon-512.png"|"./icon-512.png"|g' www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "${{ inputs.bundle_id || 'com.feng.music' }}",
            "appName": "FENG MUSIC",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 @capacitor/filesystem@6
          npm install -D tailwindcss@3
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tailwind.input.css
          npx tailwindcss -i tailwind.input.css -o www/app.css --content ./www/index.html --minify
          node -e 'const fs=require("fs"); let h=fs.readFileSync("www/index.html","utf8"); h=h.replace(/<!-- TAILWIND_CDN_TAG -->[\s\S]*?<!-- \/TAILWIND_CDN_TAG -->/, "<link rel=\"stylesheet\" href=\"./app.css\" />"); fs.writeFileSync("www/index.html",h,"utf8");'
          npx cap add ios

      - name: Configure iOS Files App Sharing & Background Audio
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivitiesFrequentUpdates bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivitiesFrequentUpdates true" "$PLIST"
          APP_GROUP="${{ inputs.app_group_id || 'group.78G3Q25PQG.1iKc' }}"
          /usr/libexec/PlistBuddy -c "Add :FengAppGroup string $APP_GROUP" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :FengAppGroup $APP_GROUP" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.feng.music.url" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string fengmusic" "$PLIST" || true

      - name: Stamp Build Version
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.8" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0.8" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"

      - name: Enable Native iOS AVPlayer, Lock Screen Controls, UITabBar Liquid Glass Dock & Security-Scoped Bookmarks
        run: |
          cat << 'EOF' > ios/App/App/AppDelegate.swift
          import UIKit
          import Capacitor
          import MediaPlayer
          import AVFoundation
          import WebKit
          import UniformTypeIdentifiers
          import WidgetKit
          #if canImport(ActivityKit)
          import ActivityKit
          #endif

          // Native AVAudioEngine Player with 5-Band AVAudioUnitEQ, AVAudioUnitTimePitch, and Smooth Gain Ramp
          final class FengAudioEnginePlayer {
              private let engine = AVAudioEngine()
              private let playerNode = AVAudioPlayerNode()
              private let timePitch = AVAudioUnitTimePitch()
              private let eqNode = AVAudioUnitEQ(numberOfBands: 5)
              private var audioFile: AVAudioFile?
              private var sampleRate: Double = 44100.0
              private var totalFrames: AVAudioFramePosition = 0
              private var seekOffsetFrames: AVAudioFramePosition = 0
              private var scheduleGeneration: Int = 0
              private var isRunningPlay = false
              private var isConfigured = false
              private var currentRate: Float = 1.0
              private var targetVolume: Float = 1.0
              private var rampTimer: Timer?
              private var timeTimer: Timer?

              var onTimeUpdate: ((Double, Double) -> Void)?
              var onEnded: (() -> Void)?

              var duration: Double {
                  guard sampleRate > 0, totalFrames > 0 else { return 0 }
                  return Double(totalFrames) / sampleRate
              }

              var isPlaying: Bool {
                  return isRunningPlay && playerNode.isPlaying
              }

              var currentTime: Double {
                  guard sampleRate > 0 else { return 0 }
                  if isRunningPlay,
                     let nodeTime = playerNode.lastRenderTime,
                     let playerTime = playerNode.playerTime(forNodeTime: nodeTime) {
                      let frames = seekOffsetFrames + playerTime.sampleTime
                      let sec = Double(max(0, frames)) / sampleRate
                      return min(duration > 0 ? duration : sec, sec)
                  }
                  return min(duration > 0 ? duration : 0, Double(max(0, seekOffsetFrames)) / sampleRate)
              }

              private func setupEngineIfNeeded() {
                  guard !isConfigured else { return }
                  isConfigured = true
                  engine.attach(playerNode)
                  engine.attach(timePitch)
                  engine.attach(eqNode)

                  let freqs: [Float] = [60, 230, 910, 3600, 14000]
                  for i in 0..<5 {
                      let band = eqNode.bands[i]
                      band.frequency = freqs[i]
                      band.bandwidth = 1.0
                      band.gain = 0
                      band.bypass = false
                      if i == 0 {
                          band.filterType = .lowShelf
                      } else if i == 4 {
                          band.filterType = .highShelf
                      } else {
                          band.filterType = .parametric
                      }
                  }
                  eqNode.bypass = true

                  engine.connect(playerNode, to: timePitch, format: nil)
                  engine.connect(timePitch, to: eqNode, format: nil)
                  engine.connect(eqNode, to: engine.mainMixerNode, format: nil)
              }

              func load(url: URL, resumeTime: Double, rate: Float, autoPlay: Bool) -> Bool {
                  guard url.isFileURL else { return false }
                  stop()
                  setupEngineIfNeeded()
                  do {
                      let file = try AVAudioFile(forReading: url)
                      let fmt = file.processingFormat
                      guard fmt.sampleRate > 0, file.length > 0 else { return false }
                      self.audioFile = file
                      self.sampleRate = fmt.sampleRate
                      self.totalFrames = file.length
                      self.currentRate = max(0.25, min(2.0, rate))
                      self.timePitch.rate = self.currentRate
                      self.seekOffsetFrames = min(
                          max(0, AVAudioFramePosition(resumeTime * fmt.sampleRate)),
                          max(0, file.length - 1)
                      )

                      engine.disconnectNodeOutput(playerNode)
                      engine.connect(playerNode, to: timePitch, format: fmt)
                      engine.connect(timePitch, to: eqNode, format: fmt)
                      engine.connect(eqNode, to: engine.mainMixerNode, format: fmt)
                      if !engine.isRunning {
                          try engine.start()
                      }
                      scheduleFromOffset(autoPlay: autoPlay)
                      startTimeTimer()
                      return true
                  } catch {
                      self.audioFile = nil
                      return false
                  }
              }

              private func scheduleFromOffset(autoPlay: Bool) {
                  guard let file = audioFile else { return }
                  scheduleGeneration += 1
                  let myGen = scheduleGeneration
                  playerNode.stop()
                  let remaining = max(0, totalFrames - seekOffsetFrames)
                  guard remaining > 0 else {
                      isRunningPlay = false
                      return
                  }
                  playerNode.scheduleSegment(
                      file,
                      startingFrame: seekOffsetFrames,
                      frameCount: AVAudioFrameCount(min(remaining, AVAudioFramePosition(UInt32.max))),
                      at: nil,
                      completionCallbackType: .dataPlayedBack
                  ) { [weak self] _ in
                      DispatchQueue.main.async {
                          guard let self = self, self.scheduleGeneration == myGen, self.isRunningPlay else { return }
                          self.isRunningPlay = false
                          self.seekOffsetFrames = self.totalFrames
                          self.onEnded?()
                      }
                  }
                  if autoPlay {
                      if !engine.isRunning { try? engine.start() }
                      playerNode.play()
                      isRunningPlay = true
                  } else {
                      isRunningPlay = false
                  }
              }

              func play() {
                  guard audioFile != nil else { return }
                  try? AVAudioSession.sharedInstance().setActive(true)
                  if !engine.isRunning { try? engine.start() }
                  if !isRunningPlay {
                      scheduleFromOffset(autoPlay: true)
                  } else if !playerNode.isPlaying {
                      playerNode.play()
                  }
                  startTimeTimer()
              }

              func pause() {
                  guard audioFile != nil else { return }
                  let curSec = currentTime
                  seekOffsetFrames = min(max(0, AVAudioFramePosition(curSec * sampleRate)), max(0, totalFrames - 1))
                  isRunningPlay = false
                  scheduleGeneration += 1
                  playerNode.pause()
              }

              func seek(to seconds: Double) {
                  guard audioFile != nil, sampleRate > 0 else { return }
                  let clamped = max(0, min(duration > 0 ? duration - 0.05 : seconds, seconds))
                  let wasPlaying = isPlaying
                  seekOffsetFrames = AVAudioFramePosition(clamped * sampleRate)
                  scheduleFromOffset(autoPlay: wasPlaying)
              }

              func setRate(_ rate: Float) {
                  currentRate = max(0.25, min(2.0, rate))
                  timePitch.rate = currentRate
              }

              func applyFx(eqEnabled: Bool, eqGains: [Float], loudnessGain: Float, fadeFactor: Float, rampSec: Double) {
                  setupEngineIfNeeded()
                  eqNode.bypass = !eqEnabled
                  for i in 0..<min(5, eqGains.count) {
                      eqNode.bands[i].gain = eqEnabled ? max(-12.0, min(12.0, eqGains[i])) : 0.0
                  }
                  let newVol = max(0.0, min(2.0, loudnessGain * fadeFactor))
                  targetVolume = newVol
                  rampTimer?.invalidate()
                  rampTimer = nil
                  if rampSec <= 0.04 {
                      engine.mainMixerNode.outputVolume = newVol
                  } else {
                      let startVol = engine.mainMixerNode.outputVolume
                      let steps = max(2, Int(rampSec / 0.02))
                      var stepIdx = 0
                      rampTimer = Timer.scheduledTimer(withTimeInterval: 0.02, repeats: true) { [weak self] t in
                          guard let self = self else { t.invalidate(); return }
                          stepIdx += 1
                          let frac = min(1.0, Float(stepIdx) / Float(steps))
                          self.engine.mainMixerNode.outputVolume = startVol + (newVol - startVol) * frac
                          if stepIdx >= steps {
                              t.invalidate()
                              self.rampTimer = nil
                          }
                      }
                  }
              }

              private func startTimeTimer() {
                  timeTimer?.invalidate()
                  timeTimer = Timer.scheduledTimer(withTimeInterval: 0.25, repeats: true) { [weak self] _ in
                      guard let self = self, self.audioFile != nil else { return }
                      self.onTimeUpdate?(self.currentTime, self.duration)
                  }
              }

              func stop() {
                  scheduleGeneration += 1
                  isRunningPlay = false
                  timeTimer?.invalidate()
                  timeTimer = nil
                  rampTimer?.invalidate()
                  rampTimer = nil
                  if isConfigured {
                      playerNode.stop()
                  }
                  audioFile = nil
                  totalFrames = 0
                  seekOffsetFrames = 0
              }
          }

          final class FengRemoteMediaBridge: NSObject, WKScriptMessageHandler, UITabBarDelegate, UIDocumentPickerDelegate {
              static let shared = FengRemoteMediaBridge()
              private var isConfigured = false
              private var isAttached = false
              weak var webView: WKWebView?

              // Keep strong reference to active picker & security-scoped folder URLs across app lifecycle
              private weak var activeFolderPicker: UIDocumentPickerViewController?
              private var isExportingDocument = false
              private var isPickingAudioFiles = false
              private var activeScopedURLs: [String: URL] = [:]
              private let bookmarkDefaultsKey = "feng_security_scoped_folder_bookmarks_v3"

              private var player: AVPlayer?
              private let enginePlayer = FengAudioEnginePlayer()
              private var useEnginePlayer = false
              private var fxEqEnabled = false
              private var fxEqGains: [Float] = [0, 0, 0, 0, 0]
              private var fxLoudnessGain: Float = 1.0
              private var fxFadeFactor: Float = 1.0
              private var currentLyricLine: String = ""
              private var liveActivityRef: Any? = nil
              private var timeObserver: Any?
              private var endObserver: NSObjectProtocol?
              private var failedObserver: NSObjectProtocol?
              private var didSendMeta = false
              private var didSendError = false
              private var pendingResumeTime: Double = 0
              private var currentDuration: Double = 0
              private var currentRate: Float = 1.0
              private var currentTitle: String = "FENG MUSIC"
              private var currentArtist: String = ""
              private var currentAlbum: String = ""
