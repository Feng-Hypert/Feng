name: Build Offline Android APK & iOS IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'iOS/Android 主包名（小组件会自动使用 <bundle_id>.widget）'
        required: false
        default: 'com.feng.music'
      app_group_id:
        description: 'iOS App Group ID（供主 App 与桌面小组件共享播放状态，需与 p12 描述文件匹配）'
        required: false
        default: 'group.78G3Q25PQG.1iKc'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Web Assets & Android
        run: |
          mkdir -p www
          cp radio.html www/index.html
          cp icon-512.png www/icon-512.png
          sed -i 's|"/icon-512.png"|"./icon-512.png"|g' www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "${{ inputs.bundle_id || 'com.feng.music' }}",
            "appName": "FENG MUSIC",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6
          npm install -D tailwindcss@3
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tailwind.input.css
          npx tailwindcss -i tailwind.input.css -o www/app.css --content ./www/index.html --minify
          node -e 'const fs=require("fs"); let h=fs.readFileSync("www/index.html","utf8"); h=h.replace(/<!-- TAILWIND_CDN_TAG -->[\s\S]*?<!-- \/TAILWIND_CDN_TAG -->/, "<link rel=\"stylesheet\" href=\"./app.css\" />"); fs.writeFileSync("www/index.html",h,"utf8");'
          npx cap add android
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick
          fi
          IM_CMD="$(command -v convert || command -v magick || true)"
          [ -n "$IM_CMD" ] || { echo "ERROR: ImageMagick is required for Android adaptive icon generation"; exit 1; }
          for spec in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
            IFS=':' read -r dens legacy adapt <<< "$spec"
            dir="android/app/src/main/res/mipmap-$dens"
            mkdir -p "$dir"
            "$IM_CMD" icon-512.png -resize "${legacy}x${legacy}" "$dir/ic_launcher.png"
            "$IM_CMD" icon-512.png -resize "${legacy}x${legacy}" "$dir/ic_launcher_round.png"
            "$IM_CMD" -size "${adapt}x${adapt}" "gradient:#D1F2F5-#FFFFFF" "$dir/ic_launcher_background.png"
            fg=$(( adapt * 66 / 100 ))
            "$IM_CMD" -size "${adapt}x${adapt}" xc:none \( icon-512.png -resize "${fg}x${fg}" \) -gravity center -composite "$dir/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat << 'XMLEOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XMLEOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Inject Android Folder & MediaStore Bridge (SAF + MediaStore + Batch Import)
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.feng.music' }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          # 0. Stamp Android app versionName "1.0.8" and versionCode
          sed -i 's/versionName "[^"]*"/versionName "1.0.8"/' android/app/build.gradle
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${BUILD_NUM}/" android/app/build.gradle

          # 1. Add androidx.documentfile and androidx.core dependencies to android/app/build.gradle
          if ! grep -q "androidx.documentfile:documentfile" android/app/build.gradle; then
            sed -i '/dependencies {/a\    implementation "androidx.documentfile:documentfile:1.0.1"' android/app/build.gradle
          fi
          if ! grep -q "androidx.core:core:" android/app/build.gradle; then
            sed -i '/dependencies {/a\    implementation "androidx.core:core:1.13.1"' android/app/build.gradle
          fi

          # 2. Add MediaStore audio permissions to AndroidManifest.xml (no MANAGE_EXTERNAL_STORAGE)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
          fi
          if ! grep -q "FengWidgetProvider" "$MANIFEST"; then
            sed -i 's|</application>|    <receiver android:name=".FengWidgetProvider" android:exported="false" android:label="FENG MUSIC">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/feng_widget_info" />\n        </receiver>\n    </application>|' "$MANIFEST"
          fi
          if ! grep -q "FOREGROUND_SERVICE_MEDIA_PLAYBACK" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi
          if ! grep -q "FengMediaKeepAliveService" "$MANIFEST"; then
            sed -i 's|</application>|    <service android:name=".FengMediaKeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>|' "$MANIFEST"
          fi

          # 3. Write MainActivity.java implementing FengAndroidBridge (SAF + MediaStore + pickAudioFiles)
          PKG_PATH="$(echo "$BUNDLE_ID" | tr '.' '/')"
          MAIN_ACT="android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          mkdir -p "$(dirname "$MAIN_ACT")"

          echo "package ${BUNDLE_ID};" > "$MAIN_ACT"
          cat << 'JAVAEOF' >> "$MAIN_ACT"

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.UriPermission;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.view.View;
          import android.view.WindowManager;
          import android.media.MediaMetadataRetriever;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.core.content.ContextCompat;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import androidx.documentfile.provider.DocumentFile;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.ref.WeakReference;
          import java.nio.charset.Charset;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends BridgeActivity {
              private static final String PREF_NAME = "feng_android_folder";
              private static final String KEY_GRANTS = "tree_grants_v1";
              private static final int MAX_DEPTH = 8;
              private static final long MAX_LRC_BYTES = 256L * 1024L;
              private static final int PATCH_BATCH_SIZE = 6;
              private static final Set<String> AUDIO_EXTS = new HashSet<>(
                  Arrays.asList("mp3", "flac", "m4a", "wav", "aac", "ogg")
              );
              private static final Pattern YEAR_PATTERN = Pattern.compile("\\b(19\\d{2}|20\\d{2})\\b");

              private final ExecutorService scanExecutor = Executors.newSingleThreadExecutor();
              private final ExecutorService coverExecutor = Executors.newSingleThreadExecutor();
              private volatile boolean destroyedFlag = false;

              private ActivityResultLauncher<Uri> folderPickerLauncher;
              private ActivityResultLauncher<String[]> audioFilesLauncher;
              private ActivityResultLauncher<String> mediaPermissionLauncher;

              private static class AudioTarget {
                  final Uri uri;
                  final String uriStr;
                  final String relKey;
                  final String name;
                  final String lrc;
                  final String title;
                  final String artist;
                  final String album;
                  final String year;

                  AudioTarget(Uri uri, String relKey, String name, String lrc, String title, String artist, String album, String year) {
                      this.uri = uri;
                      this.uriStr = uri.toString();
                      this.relKey = relKey;
                      this.name = name;
                      this.lrc = lrc != null ? lrc : "";
                      this.title = title != null ? title : "";
                      this.artist = artist != null ? artist : "";
                      this.album = album != null ? album : "";
                      this.year = year != null ? year : "";
                  }
              }

              // §12 Samsung bottom inset extra buffer (dp) — adjust here if needed
              private static final int SAMSUNG_BOTTOM_INSET_EXTRA_DP = 4;

              // §13 Android Home Screen Widget host & sync state
              public static final String WIDGET_PREF_NAME = "feng_widget";
              public static final String WIDGET_COVER_FILE = "widget_cover.jpg";
              public static final String EXTRA_WIDGET_OPEN = "widget_open";
              private static volatile WeakReference<MainActivity> widgetHost = new WeakReference<>(null);
              private final Handler widgetSyncHandler = new Handler(Looper.getMainLooper());
              private Runnable pendingWidgetSyncRunnable = null;
              private volatile boolean pendingOpenNowPlaying = false;
              private volatile boolean webIsPlaying = false;
              private volatile String webCurrentTitle = "FENG MUSIC";
              private volatile String webCurrentArtist = "";

              private void syncBackgroundKeepAliveService(boolean playing, String title, String artist) {
                  webIsPlaying = playing;
                  if (title != null && !title.isEmpty()) webCurrentTitle = title;
                  webCurrentArtist = artist == null ? "" : artist;
                  try {
                      Intent svc = new Intent(getApplicationContext(), FengMediaKeepAliveService.class);
                      if (playing) {
                          svc.setAction(FengMediaKeepAliveService.ACTION_START_OR_UPDATE);
                          svc.putExtra("title", webCurrentTitle);
                          svc.putExtra("artist", webCurrentArtist);
                          ContextCompat.startForegroundService(getApplicationContext(), svc);
                      } else {
                          getApplicationContext().stopService(svc);
                      }
                  } catch (Exception ignored) {
                  }
              }

              public static boolean dispatchWidgetCommand(String cmd) {
                  MainActivity host = widgetHost != null ? widgetHost.get() : null;
                  if (host == null || host.destroyedFlag || host.getBridge() == null) return false;
                  WebView wv = host.getBridge().getWebView();
                  if (wv == null) return false;
                  final String js = "window.__fengWidgetCommand && window.__fengWidgetCommand(" + JSONObject.quote(cmd) + ");";
                  wv.post(() -> {
                      if (!host.destroyedFlag) {
                          wv.evaluateJavascript(js, null);
                      }
                  });
                  return true;
              }

              private void handleWidgetIntent(Intent intent) {
                  if (intent == null) return;
                  if ("nowplaying".equals(intent.getStringExtra(EXTRA_WIDGET_OPEN))) {
                      pendingOpenNowPlaying = true;
                      intent.removeExtra(EXTRA_WIDGET_OPEN);
                      flushPendingOpenNowPlaying();
                  }
              }

              private void flushPendingOpenNowPlaying() {
                  if (!pendingOpenNowPlaying || destroyedFlag || getBridge() == null) return;
                  WebView wv = getBridge().getWebView();
                  if (wv == null) return;
                  wv.postDelayed(() -> {
                      if (!pendingOpenNowPlaying || destroyedFlag) return;
                      wv.evaluateJavascript(
                          "(function(){ if (typeof window.__fengOpenNowPlaying === 'function') { window.__fengOpenNowPlaying(); return 'ok'; } return 'wait'; })()",
                          val -> {
                              if (val != null && val.contains("ok")) {
                                  pendingOpenNowPlaying = false;
                              }
                          }
                      );
                  }, 180);
              }

              private void scheduleWidgetSync(String title, String artist, String album, boolean isPlaying, double elapsed, double duration, String coverDataUrl) {
                  if (pendingWidgetSyncRunnable != null) {
                      widgetSyncHandler.removeCallbacks(pendingWidgetSyncRunnable);
                  }
                  pendingWidgetSyncRunnable = () -> {
                      if (destroyedFlag) return;
                      coverExecutor.execute(() -> {
                          try {
                              File coverFile = new File(getFilesDir(), WIDGET_COVER_FILE);
                              if (coverDataUrl != null && !coverDataUrl.isEmpty()) {
                                  String b64 = coverDataUrl;
                                  int comma = b64.indexOf(',');
                                  if (comma >= 0) b64 = b64.substring(comma + 1);
                                  byte[] decoded = Base64.decode(b64, Base64.DEFAULT);
                                  if (decoded != null && decoded.length > 0) {
                                      try (FileOutputStream fos = new FileOutputStream(coverFile, false)) {
                                          fos.write(decoded);
                                          fos.flush();
                                      }
                                  } else if (coverFile.exists()) {
                                      coverFile.delete();
                                  }
                              } else {
                                  if (coverFile.exists()) coverFile.delete();
                              }
                              SharedPreferences sp = getSharedPreferences(WIDGET_PREF_NAME, MODE_PRIVATE);
                              sp.edit()
                                  .putBoolean("w_has_data", title != null && !title.isEmpty())
                                  .putString("w_title", title == null ? "" : title)
                                  .putString("w_artist", artist == null ? "" : artist)
                                  .putString("w_album", album == null ? "" : album)
                                  .putBoolean("w_playing", isPlaying)
                                  .putFloat("w_elapsed", (float) Math.max(0.0, elapsed))
                                  .putFloat("w_duration", (float) Math.max(0.0, duration))
                                  .commit();
                              FengWidgetProvider.refreshAll(getApplicationContext());
                          } catch (Exception ignored) {
                          }
                      });
                  };
                  widgetSyncHandler.postDelayed(pendingWidgetSyncRunnable, 150);
              }

              private volatile int lastInsetTopPx = 0;
              private volatile int lastInsetBottomPx = 0;

              private int adjustBottomInsetDp(int bottomDp) {
                  if (Build.MANUFACTURER != null && "samsung".equalsIgnoreCase(Build.MANUFACTURER.trim())) {
                      return bottomDp + SAMSUNG_BOTTOM_INSET_EXTRA_DP;
                  }
                  return bottomDp;
              }

              private void refreshInsetsFromRoot() {
                  try {
                      View decorView = getWindow().getDecorView();
                      WindowInsetsCompat rootInsets = ViewCompat.getRootWindowInsets(decorView);
                      if (rootInsets != null) {
                          Insets bars = rootInsets.getInsets(WindowInsetsCompat.Type.systemBars());
                          float density = getResources().getDisplayMetrics().density;
                          if (density <= 0f) density = 1f;
                          lastInsetTopPx = Math.round(bars.top / density);
                          lastInsetBottomPx = adjustBottomInsetDp(Math.round(bars.bottom / density));
                      }
                  } catch (Exception ignored) {}
              }

              private void pushSystemInsetsToWeb() {
                  if (destroyedFlag) return;
                  runOnUiThread(() -> {
                      refreshInsetsFromRoot();
                      final int top = lastInsetTopPx;
                      final int bottom = lastInsetBottomPx;
                      final String js = "window.__fengSetSystemInsets && window.__fengSetSystemInsets(" + top + "," + bottom + ");";
                      try {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript(js, null);
                          }
                      } catch (Exception ignored) {}
                  });
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().clearFlags(
                      WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS
                      | WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION
                  );
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= 29) {
                      getWindow().setStatusBarContrastEnforced(false);
                      getWindow().setNavigationBarContrastEnforced(false);
                  }
                  WindowInsetsControllerCompat insetsController =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (insetsController != null) {
                      insetsController.setAppearanceLightStatusBars(false);
                      insetsController.setAppearanceLightNavigationBars(false);
                  }
                  View decorView = getWindow().getDecorView();
                  ViewCompat.setOnApplyWindowInsetsListener(decorView, (v, windowInsets) -> {
                      Insets bars = windowInsets.getInsets(WindowInsetsCompat.Type.systemBars());
                      float density = getResources().getDisplayMetrics().density;
                      if (density <= 0f) density = 1f;
                      lastInsetTopPx = Math.round(bars.top / density);
                      lastInsetBottomPx = adjustBottomInsetDp(Math.round(bars.bottom / density));
                      pushSystemInsetsToWeb();
                      return windowInsets;
                  });
                  ViewCompat.requestApplyInsets(decorView);

                  folderPickerLauncher = registerForActivityResult(
                      new ActivityResultContracts.OpenDocumentTree(),
                      this::onFolderPicked
                  );

                  audioFilesLauncher = registerForActivityResult(
                      new ActivityResultContracts.OpenMultipleDocuments(),
                      this::onAudioFilesPicked
                  );

                  mediaPermissionLauncher = registerForActivityResult(
                      new ActivityResultContracts.RequestPermission(),
                      granted -> {
                          if (Boolean.TRUE.equals(granted)) {
                              runMediaStoreScan();
                          } else {
                              dispatchStringToWeb("__fengFolderPickerStatus", "未获得媒体权限，无法扫描本机音乐库");
                          }
                      }
                  );

                  widgetHost = new WeakReference<>(this);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(new FengFolderJsBridge(), "FengAndroidBridge");
                  }
                  handleWidgetIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleWidgetIntent(intent);
              }

              @Override
              public void onResume() {
                  super.onResume();
                  pushSystemInsetsToWeb();
                  getWindow().getDecorView().postDelayed(this::pushSystemInsetsToWeb, 500);
                  getWindow().getDecorView().postDelayed(this::pushSystemInsetsToWeb, 1200);
              }

              @Override
              public void onPause() {
                  super.onPause();
                  // Keep WebView <audio> & Web Audio graph alive in background instead of Capacitor pausing it
                  if (webIsPlaying && getBridge() != null && getBridge().getWebView() != null) {
                      try {
                          WebView wv = getBridge().getWebView();
                          wv.onResume();
                          wv.resumeTimers();
                      } catch (Exception ignored) {
                      }
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (webIsPlaying) {
                      moveTaskToBack(true);
                      return;
                  }
                  super.onBackPressed();
              }

              @Override
              public void onDestroy() {
                  try {
                      getApplicationContext().stopService(new Intent(getApplicationContext(), FengMediaKeepAliveService.class));
                  } catch (Exception ignored) {}
                  destroyedFlag = true;
                  widgetSyncHandler.removeCallbacksAndMessages(null);
                  MainActivity current = widgetHost != null ? widgetHost.get() : null;
                  if (current == this) {
                      widgetHost = new WeakReference<>(null);
                  }
                  scanExecutor.shutdownNow();
                  coverExecutor.shutdownNow();
                  super.onDestroy();
              }

              private class FengFolderJsBridge {
                  @JavascriptInterface
                  public void postFolderMessage(String jsonStr) {
                      if (jsonStr == null || jsonStr.isEmpty()) return;
                      runOnUiThread(() -> {
                          try {
                              JSONObject msg = new JSONObject(jsonStr);
                              String action = msg.optString("action", "");
                              if ("pickFolder".equals(action)) {
                                  folderPickerLauncher.launch(null);
                              } else if ("pickAudioFiles".equals(action)) {
                                  audioFilesLauncher.launch(new String[]{"*/*"});
                              } else if ("rescanBookmarks".equals(action)) {
                                  boolean silent = msg.optBoolean("silent", true);
                                  rescanBookmarkedTrees(silent);
                              } else if ("removeBookmark".equals(action)) {
                                  String key = msg.optString("key", "");
                                  removeBookmarkedTree(key);
                              } else if ("scanMediaStore".equals(action)) {
                                  startMediaStoreScanWithPermission();
                              } else if ("widgetSync".equals(action)) {
                                  String wTitle = msg.optString("title", "");
                                  String wArtist = msg.optString("artist", "");
                                  String wAlbum = msg.optString("album", "");
                                  boolean wPlaying = msg.optBoolean("isPlaying", false);
                                  double wElapsed = msg.optDouble("elapsed", 0.0);
                                  double wDuration = msg.optDouble("duration", 0.0);
                                  String wCover = msg.isNull("cover") ? null : msg.optString("cover", "");
                                  syncBackgroundKeepAliveService(wPlaying, wTitle, wArtist);
                                  scheduleWidgetSync(wTitle, wArtist, wAlbum, wPlaying, wElapsed, wDuration, wCover);
                              }
                              if (pendingOpenNowPlaying) {
                                  flushPendingOpenNowPlaying();
                              }
                          } catch (Exception ignored) {
                          }
                      });
                  }
              }

              private void dispatchJsonToWeb(String callbackName, JSONObject payload) {
                  if (destroyedFlag || getBridge() == null) return;
                  WebView wv = getBridge().getWebView();
                  if (wv == null) return;
                  final String js = "window." + callbackName + " && window." + callbackName + "(" + payload.toString() + ");";
                  wv.post(() -> {
                      if (!destroyedFlag) {
                          wv.evaluateJavascript(js, null);
                      }
                  });
              }

              private void dispatchStringToWeb(String callbackName, String message) {
                  if (destroyedFlag || getBridge() == null) return;
                  WebView wv = getBridge().getWebView();
                  if (wv == null) return;
                  final String js = "window." + callbackName + " && window." + callbackName + "(" + JSONObject.quote(message) + ");";
                  wv.post(() -> {
                      if (!destroyedFlag) {
                          wv.evaluateJavascript(js, null);
                      }
                  });
              }

              // MARK: - SAF Grants Persistence
              private JSONArray loadGrants() {
                  SharedPreferences sp = getSharedPreferences(PREF_NAME, MODE_PRIVATE);
                  String raw = sp.getString(KEY_GRANTS, "[]");
                  try {
                      return new JSONArray(raw);
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              private void saveGrants(JSONArray arr) {
                  getSharedPreferences(PREF_NAME, MODE_PRIVATE)
                      .edit()
                      .putString(KEY_GRANTS, arr.toString())
                      .apply();
              }

              private Set<String> getPersistedReadUriStrings() {
                  Set<String> active = new HashSet<>();
                  try {
                      List<UriPermission> perms = getContentResolver().getPersistedUriPermissions();
                      for (UriPermission p : perms) {
                          if (p.isReadPermission() && p.getUri() != null) {
                              active.add(p.getUri().toString());
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  return active;
              }

              private void pushBoundFolders() {
                  JSONArray grants = loadGrants();
                  Set<String> persisted = getPersistedReadUriStrings();
                  JSONArray folders = new JSONArray();
                  for (int i = 0; i < grants.length(); i++) {
                      JSONObject item = grants.optJSONObject(i);
                      if (item == null) continue;
                      String treeUri = item.optString("treeUri", "");
                      String name = item.optString("name", "已关联文件夹");
                      if (treeUri.isEmpty()) continue;
                      try {
                          JSONObject f = new JSONObject();
                          f.put("key", treeUri);
                          f.put("name", name);
                          f.put("active", persisted.contains(treeUri));
                          folders.put(f);
                      } catch (Exception ignored) {
                      }
                  }
                  try {
                      JSONObject payload = new JSONObject();
                      payload.put("folders", folders);
                      dispatchJsonToWeb("__fengBoundFolders", payload);
                  } catch (Exception ignored) {
                  }
              }

              private void onFolderPicked(Uri treeUri) {
                  if (treeUri == null) {
                      try {
                          JSONObject cancelPayload = new JSONObject();
                          cancelPayload.put("cancelled", true);
                          dispatchJsonToWeb("__fengPickedFolderFiles", cancelPayload);
                      } catch (Exception ignored) {
                      }
                      return;
                  }
                  try {
                      getContentResolver().takePersistableUriPermission(treeUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  } catch (Exception e) {
                      dispatchStringToWeb("__fengFolderPickerStatus", "持久化文件夹授权失败：" + e.getMessage());
                  }

                  DocumentFile rootDoc = DocumentFile.fromTreeUri(this, treeUri);
                  String folderName = (rootDoc != null && rootDoc.getName() != null && !rootDoc.getName().isEmpty())
                      ? rootDoc.getName()
                      : "已关联文件夹";
                  String treeStr = treeUri.toString();

                  JSONArray grants = loadGrants();
                  JSONArray next = new JSONArray();
                  for (int i = 0; i < grants.length(); i++) {
                      JSONObject existing = grants.optJSONObject(i);
                      if (existing != null && !treeStr.equals(existing.optString("treeUri", ""))) {
                          next.put(existing);
                      }
                  }
                  try {
                      JSONObject entry = new JSONObject();
                      entry.put("treeUri", treeStr);
                      entry.put("name", folderName);
                      next.put(entry);
                  } catch (Exception ignored) {
                  }
                  saveGrants(next);
                  pushBoundFolders();

                  try {
                      JSONObject scanNotice = new JSONObject();
                      scanNotice.put("folderName", folderName);
                      dispatchJsonToWeb("__fengFolderScanning", scanNotice);
                  } catch (Exception ignored) {
                  }

                  scanExecutor.execute(() -> enumerateSafTree(treeUri, folderName, false));
              }

              private void rescanBookmarkedTrees(boolean silent) {
                  scanExecutor.execute(() -> {
                      JSONArray grants = loadGrants();
                      Set<String> persisted = getPersistedReadUriStrings();
                      for (int i = 0; i < grants.length(); i++) {
                          if (destroyedFlag) return;
                          JSONObject item = grants.optJSONObject(i);
                          if (item == null) continue;
                          String treeStr = item.optString("treeUri", "");
                          String name = item.optString("name", "已关联文件夹");
                          if (treeStr.isEmpty() || !persisted.contains(treeStr)) continue;
                          enumerateSafTree(Uri.parse(treeStr), name, silent);
                      }
                      pushBoundFolders();
                  });
              }

              private void removeBookmarkedTree(String key) {
                  if (key == null || key.isEmpty()) return;
                  JSONArray grants = loadGrants();
                  JSONArray next = new JSONArray();
                  for (int i = 0; i < grants.length(); i++) {
                      JSONObject item = grants.optJSONObject(i);
                      if (item != null && !key.equals(item.optString("treeUri", ""))) {
                          next.put(item);
                      }
                  }
                  saveGrants(next);
                  try {
                      getContentResolver().releasePersistableUriPermission(Uri.parse(key), Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  } catch (Exception ignored) {
                  }
                  pushBoundFolders();
              }

              private void enumerateSafTree(Uri treeUri, String folderName, boolean silent) {
                  DocumentFile rootDoc = DocumentFile.fromTreeUri(this, treeUri);
                  if (rootDoc == null || !rootDoc.canRead()) {
                      try {
                          JSONObject errPayload = new JSONObject();
                          errPayload.put("cancelled", false);
                          errPayload.put("silent", silent);
                          errPayload.put("folderName", folderName);
                          errPayload.put("error", "无法读取所选文件夹，请重新授权");
                          errPayload.put("files", new JSONArray());
                          dispatchJsonToWeb("__fengPickedFolderFiles", errPayload);
                      } catch (Exception ignored) {
                      }
                      return;
                  }

                  List<AudioTarget> targets = new ArrayList<>();
                  Map<String, String> globalLrcMap = new HashMap<>();
                  walkDocumentDir(rootDoc, folderName, "", 0, targets, globalLrcMap);
                  if (!globalLrcMap.isEmpty()) {
                      for (int i = 0; i < targets.size(); i++) {
                          AudioTarget t = targets.get(i);
                          if (t.lrc.isEmpty()) {
                              String base = stripExt(t.name).trim().toLowerCase(Locale.ROOT);
                              String fallbackLrc = globalLrcMap.get(base);
                              if (fallbackLrc != null && !fallbackLrc.isEmpty()) {
                                  targets.set(i, new AudioTarget(t.uri, t.relKey, t.name, fallbackLrc, t.title, t.artist, t.album, t.year));
                              }
                          }
                      }
                  }

                  JSONArray filesArr = new JSONArray();
                  for (AudioTarget t : targets) {
                      try {
                          JSONObject f = new JSONObject();
                          f.put("name", t.name);
                          f.put("uri", t.uriStr);
                          f.put("relKey", t.relKey);
                          f.put("lrc", t.lrc);
                          f.put("title", t.title);
                          f.put("artist", t.artist);
                          f.put("album", t.album);
                          f.put("year", t.year);
                          f.put("cover", "");
                          filesArr.put(f);
                      } catch (Exception ignored) {
                      }
                  }

                  try {
                      JSONObject payload = new JSONObject();
                      payload.put("cancelled", false);
                      payload.put("silent", silent);
                      payload.put("folderName", folderName);
                      payload.put("error", "");
                      payload.put("files", filesArr);
                      dispatchJsonToWeb("__fengPickedFolderFiles", payload);
                  } catch (Exception ignored) {
                  }

                  if (!targets.isEmpty()) {
                      coverExecutor.execute(() -> patchMetadataAndCovers(targets));
                  }
              }

              private void walkDocumentDir(DocumentFile dir, String folderName, String relPrefix, int depth, List<AudioTarget> out, Map<String, String> globalLrcMap) {
                  if (destroyedFlag || depth > MAX_DEPTH || dir == null) return;
                  DocumentFile[] children;
                  try {
                      children = dir.listFiles();
                  } catch (Exception e) {
                      return;
                  }
                  if (children == null) return;

                  Map<String, String> lrcMap = new HashMap<>();
                  List<DocumentFile> audioFiles = new ArrayList<>();
                  List<DocumentFile> subDirs = new ArrayList<>();

                  for (DocumentFile child : children) {
                      String name = child.getName();
                      if (name == null || name.isEmpty() || name.startsWith(".")) continue;
                      if (child.isDirectory()) {
                          subDirs.add(child);
                      } else if (child.isFile()) {
                          String ext = getFileExt(name);
                          if ("lrc".equals(ext)) {
                              String base = stripExt(name).trim().toLowerCase(Locale.ROOT);
                              String lrcText = readSmallTextUri(child.getUri(), MAX_LRC_BYTES);
                              if (!lrcText.isEmpty()) {
                                  lrcMap.put(base, lrcText);
                                  if (!globalLrcMap.containsKey(base)) globalLrcMap.put(base, lrcText);
                              }
                          } else if (AUDIO_EXTS.contains(ext)) {
                              audioFiles.add(child);
                          }
                      }
                  }

                  for (DocumentFile af : audioFiles) {
                      String name = af.getName();
                      if (name == null) continue;
                      String base = stripExt(name).trim().toLowerCase(Locale.ROOT);
                      String relPath = relPrefix.isEmpty() ? name : (relPrefix + "/" + name);
                      String relKey = folderName + "/" + relPath;
                      String lrc = lrcMap.containsKey(base) ? lrcMap.get(base) : "";
                      out.add(new AudioTarget(af.getUri(), relKey, name, lrc, "", "", "", ""));
                  }

                  for (DocumentFile sub : subDirs) {
                      String subName = sub.getName();
                      if (subName == null) continue;
                      String nextPrefix = relPrefix.isEmpty() ? subName : (relPrefix + "/" + subName);
                      walkDocumentDir(sub, folderName, nextPrefix, depth + 1, out, globalLrcMap);
                  }
              }

              // MARK: - MediaStore Scan
              private void startMediaStoreScanWithPermission() {
                  String perm = (Build.VERSION.SDK_INT >= 33)
                      ? Manifest.permission.READ_MEDIA_AUDIO
                      : Manifest.permission.READ_EXTERNAL_STORAGE;
                  if (ContextCompat.checkSelfPermission(this, perm) == PackageManager.PERMISSION_GRANTED) {
                      runMediaStoreScan();
                  } else {
                      mediaPermissionLauncher.launch(perm);
                  }
              }

              private void runMediaStoreScan() {
                  scanExecutor.execute(() -> {
                      List<AudioTarget> targets = new ArrayList<>();
                      Set<Long> seenIds = new HashSet<>();
                      String[] projection = new String[]{
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.DISPLAY_NAME,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST,
                          MediaStore.Audio.Media.ALBUM,
                          MediaStore.Audio.Media.YEAR
                      };
                      String selection = MediaStore.Audio.Media.IS_MUSIC + " != 0";

                      try (Cursor cursor = getContentResolver().query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          projection,
                          selection,
                          null,
                          MediaStore.Audio.Media.DATE_ADDED + " DESC"
                      )) {
                          if (cursor != null) {
                              int idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID);
                              int nameCol = cursor.getColumnIndex(MediaStore.Audio.Media.DISPLAY_NAME);
                              int titleCol = cursor.getColumnIndex(MediaStore.Audio.Media.TITLE);
                              int artistCol = cursor.getColumnIndex(MediaStore.Audio.Media.ARTIST);
                              int albumCol = cursor.getColumnIndex(MediaStore.Audio.Media.ALBUM);
                              int yearCol = cursor.getColumnIndex(MediaStore.Audio.Media.YEAR);

                              while (cursor.moveToNext()) {
                                  if (destroyedFlag) return;
                                  long id = cursor.getLong(idCol);
                                  if (!seenIds.add(id)) continue;
                                  String displayName = nameCol >= 0 ? cursor.getString(nameCol) : null;
                                  String title = titleCol >= 0 ? cursor.getString(titleCol) : "";
                                  String artist = artistCol >= 0 ? cursor.getString(artistCol) : "";
                                  String album = albumCol >= 0 ? cursor.getString(albumCol) : "";
                                  int yrInt = yearCol >= 0 ? cursor.getInt(yearCol) : 0;
                                  String year = (yrInt >= 1900 && yrInt <= 2099) ? String.valueOf(yrInt) : "";

                                  if (artist != null && "<unknown>".equalsIgnoreCase(artist.trim())) artist = "";
                                  if (album != null && "<unknown>".equalsIgnoreCase(album.trim())) album = "";
                                  String safeName = (displayName != null && !displayName.trim().isEmpty())
                                      ? displayName.trim()
                                      : ((title != null && !title.trim().isEmpty()) ? title.trim() + ".mp3" : ("audio_" + id + ".mp3"));

                                  String ext = getFileExt(safeName);
                                  if (!ext.isEmpty() && !AUDIO_EXTS.contains(ext)) continue;

                                  Uri contentUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id);
                                  String relKey = "mediastore/" + id;
                                  targets.add(new AudioTarget(contentUri, relKey, safeName, "", title, artist, album, year));
                              }
                          }
                      } catch (Exception e) {
                          dispatchStringToWeb("__fengFolderPickerStatus", "扫描本机音乐库失败：" + e.getMessage());
                          return;
                      }

                      JSONArray filesArr = new JSONArray();
                      for (AudioTarget t : targets) {
                          try {
                              JSONObject f = new JSONObject();
                              f.put("name", t.name);
                              f.put("uri", t.uriStr);
                              f.put("relKey", t.relKey);
                              f.put("lrc", "");
                              f.put("title", t.title);
                              f.put("artist", t.artist);
                              f.put("album", t.album);
                              f.put("year", t.year);
                              f.put("cover", "");
                              filesArr.put(f);
                          } catch (Exception ignored) {
                          }
                      }

                      try {
                          JSONObject payload = new JSONObject();
                          payload.put("cancelled", false);
                          payload.put("silent", false);
                          payload.put("folderName", "本机音乐库");
                          payload.put("error", "");
                          payload.put("files", filesArr);
                          dispatchJsonToWeb("__fengPickedFolderFiles", payload);
                      } catch (Exception ignored) {
                      }

                      if (!targets.isEmpty()) {
                          coverExecutor.execute(() -> patchMetadataAndCovers(targets));
                      }
                  });
              }

              // MARK: - Batch File Import (Copy to Capacitor DOCUMENTS/Music)
              private void onAudioFilesPicked(List<Uri> uris) {
                  if (uris == null || uris.isEmpty()) return;
                  scanExecutor.execute(() -> {
                      File docsBase = getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS);
                      if (docsBase == null) {
                          docsBase = new File(getFilesDir(), "Documents");
                      }
                      File musicDir = new File(docsBase, "Music");
                      if (!musicDir.exists()) {
                          musicDir.mkdirs();
                      }

                      int importedAudio = 0;
                      String errMsg = "";
                      for (Uri uri : uris) {
                          if (destroyedFlag || uri == null) continue;
                          String fileName = queryDisplayName(uri);
                          if (fileName == null || fileName.trim().isEmpty()) continue;
                          String ext = getFileExt(fileName);
                          if (!AUDIO_EXTS.contains(ext) && !"lrc".equals(ext)) continue;

                          File dest = new File(musicDir, fileName);
                          try (InputStream in = getContentResolver().openInputStream(uri);
                               FileOutputStream out = new FileOutputStream(dest, false)) {
                              if (in == null) continue;
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n);
                              }
                              if (AUDIO_EXTS.contains(ext)) {
                                  importedAudio++;
                              }
                          } catch (Exception e) {
                              if (errMsg.isEmpty()) errMsg = e.getMessage() != null ? e.getMessage() : "复制文件失败";
                          }
                      }

                      try {
                          JSONObject res = new JSONObject();
                          res.put("count", importedAudio);
                          res.put("skippedOgg", 0);
                          res.put("error", importedAudio > 0 ? "" : errMsg);
                          dispatchJsonToWeb("__fengImportedNativeFiles", res);
                      } catch (Exception ignored) {
                      }
                  });
              }

              // MARK: - Async Metadata & Cover Patching (batches <= 6)
              private void patchMetadataAndCovers(List<AudioTarget> targets) {
                  JSONArray batch = new JSONArray();
                  for (AudioTarget t : targets) {
                      if (destroyedFlag) return;
                      MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                      try {
                          mmr.setDataSource(this, t.uri);
                          String title = safeMeta(mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_TITLE));
                          String artist = safeMeta(mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ARTIST));
                          String album = safeMeta(mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ALBUM));
                          String year = extractYear(safeMeta(mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_YEAR)));
                          if (year.isEmpty()) {
                              year = extractYear(safeMeta(mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DATE)));
                          }
                          String coverDataUrl = "";
                          byte[] pic = mmr.getEmbeddedPicture();
                          if (pic != null && pic.length > 32) {
                              coverDataUrl = encodeResizedCover(pic);
                          }
                          String embeddedLrc = t.lrc.isEmpty() ? extractEmbeddedLyrics(t.uri) : "";

                          if (!title.isEmpty() || !artist.isEmpty() || !album.isEmpty() || !year.isEmpty() || !coverDataUrl.isEmpty() || !embeddedLrc.isEmpty()) {
                              JSONObject item = new JSONObject();
                              item.put("relKey", t.relKey);
                              item.put("uri", t.uriStr);
                              item.put("title", title);
                              item.put("artist", artist);
                              item.put("album", album);
                              item.put("year", year);
                              item.put("cover", coverDataUrl);
                              item.put("lrc", embeddedLrc);
                              batch.put(item);
                          }
                      } catch (Exception ignored) {
                      } finally {
                          try {
                              mmr.release();
                          } catch (Exception ignored) {
                          }
                      }

                      if (batch.length() >= PATCH_BATCH_SIZE) {
                          flushCoverBatch(batch);
                          batch = new JSONArray();
                      }
                  }
                  if (batch.length() > 0 && !destroyedFlag) {
                      flushCoverBatch(batch);
                  }
              }

              private String extractEmbeddedLyrics(Uri uri) {
                  byte[] bytes = readHeadBytes(uri, 2 * 1024 * 1024);
                  if (bytes == null || bytes.length < 16) return "";
                  try {
                      if (bytes[0] == 0x49 && bytes[1] == 0x44 && bytes[2] == 0x33) {
                          return parseId3v2Lyrics(bytes);
                      }
                      if (bytes[0] == 0x66 && bytes[1] == 0x4C && bytes[2] == 0x61 && bytes[3] == 0x43) {
                          return parseFlacLyrics(bytes);
                      }
                      if (bytes.length >= 12 && bytes[4] == 0x66 && bytes[5] == 0x74 && bytes[6] == 0x79 && bytes[7] == 0x70) {
                          return parseMp4Lyrics(bytes, 0, bytes.length);
                      }
                  } catch (Exception ignored) {
                  }
                  return "";
              }

              private byte[] readHeadBytes(Uri uri, int maxBytes) {
                  try (InputStream in = getContentResolver().openInputStream(uri)) {
                      if (in == null) return null;
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int total = 0;
                      int n;
                      while (total < maxBytes && (n = in.read(buf, 0, Math.min(buf.length, maxBytes - total))) > 0) {
                          baos.write(buf, 0, n);
                          total += n;
                      }
                      return baos.toByteArray();
                  } catch (Exception e) {
                      return null;
                  }
              }

              private static String decodeTagStr(byte[] data, int off, int len, int enc) {
                  if (data == null || len <= 0 || off < 0 || off + len > data.length) return "";
                  try {
                      String raw;
                      if (enc == 1 || enc == 2) {
                          boolean be = enc == 2 && !(len >= 2 && (data[off] & 0xFF) == 0xFF && (data[off + 1] & 0xFF) == 0xFE);
                          raw = new String(data, off, len, be ? StandardCharsets.UTF_16BE : StandardCharsets.UTF_16);
                      } else if (enc == 3) {
                          raw = new String(data, off, len, StandardCharsets.UTF_8);
                      } else {
                          raw = new String(data, off, len, StandardCharsets.UTF_8);
                          if (raw.indexOf(0xFFFD) >= 0) {
                              try {
                                  raw = new String(data, off, len, Charset.forName("GB18030"));
                              } catch (Exception ignored) {
                                  raw = new String(data, off, len, StandardCharsets.ISO_8859_1);
                              }
                          }
                      }
                      return raw.replace(String.valueOf((char) 0), "").trim();
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static int findNullTerm(byte[] b, int start, int end, boolean utf16) {
                  if (utf16) {
                      for (int i = start; i + 1 < end; i += 2) {
                          if (b[i] == 0 && b[i + 1] == 0) return i;
                      }
                      return end;
                  }
                  for (int i = start; i < end; i++) {
                      if (b[i] == 0) return i;
                  }
                  return end;
              }

              private static String parseId3v2Lyrics(byte[] b) {
                  int major = b[3] & 0xFF;
                  if (major < 2 || major > 4) return "";
                  int tagSize = ((b[6] & 0x7F) << 21) | ((b[7] & 0x7F) << 14) | ((b[8] & 0x7F) << 7) | (b[9] & 0x7F);
                  int end = Math.min(b.length, 10 + tagSize);
                  int pos = 10;
                  int flags = b[5] & 0xFF;
                  if ((flags & 0x40) != 0 && pos + 4 <= end) {
                      int ext = ((b[pos] & 0xFF) << 24) | ((b[pos + 1] & 0xFF) << 16) | ((b[pos + 2] & 0xFF) << 8) | (b[pos + 3] & 0xFF);
                      pos += (major == 3 ? 4 + ext : ext);
                  }
                  int hdrLen = major == 2 ? 6 : 10;
                  String best = "";
                  while (pos + hdrLen <= end && b[pos] != 0) {
                      String id;
                      int fSize;
                      if (major == 2) {
                          id = new String(b, pos, 3, StandardCharsets.ISO_8859_1);
                          fSize = ((b[pos + 3] & 0xFF) << 16) | ((b[pos + 4] & 0xFF) << 8) | (b[pos + 5] & 0xFF);
                      } else {
                          id = new String(b, pos, 4, StandardCharsets.ISO_8859_1);
                          int raw = ((b[pos + 4] & 0xFF) << 24) | ((b[pos + 5] & 0xFF) << 16) | ((b[pos + 6] & 0xFF) << 8) | (b[pos + 7] & 0xFF);
                          int ss = ((b[pos + 4] & 0x7F) << 21) | ((b[pos + 5] & 0x7F) << 14) | ((b[pos + 6] & 0x7F) << 7) | (b[pos + 7] & 0x7F);
                          fSize = (major == 4 && pos + hdrLen + ss <= end) ? ss : raw;
                      }
                      if (fSize <= 0 || pos + hdrLen + fSize > end) break;
                      int fStart = pos + hdrLen;
                      int fEnd = fStart + fSize;
                      pos = fEnd;
                      if ("USLT".equals(id) || "ULT".equals(id)) {
                          if (fSize > 4) {
                              int enc = b[fStart] & 0xFF;
                              boolean u16 = enc == 1 || enc == 2;
                              int dEnd = findNullTerm(b, fStart + 4, fEnd, u16);
                              int tStart = dEnd + (u16 ? 2 : 1);
                              if (tStart < fEnd) {
                                  String txt = decodeTagStr(b, tStart, fEnd - tStart, enc);
                                  if (txt.length() > best.length()) best = txt;
                              }
                          }
                      } else if ("TXXX".equals(id) || "TXX".equals(id)) {
                          if (fSize > 2) {
                              int enc = b[fStart] & 0xFF;
                              boolean u16 = enc == 1 || enc == 2;
                              int dEnd = findNullTerm(b, fStart + 1, fEnd, u16);
                              String desc = decodeTagStr(b, fStart + 1, dEnd - (fStart + 1), enc).toUpperCase(Locale.ROOT);
                              int vStart = dEnd + (u16 ? 2 : 1);
                              if (vStart < fEnd && (desc.contains("LYRIC") || "LRC".equals(desc))) {
                                  String txt = decodeTagStr(b, vStart, fEnd - vStart, enc);
                                  if (txt.length() > best.length()) best = txt;
                              }
                          }
                      }
                  }
                  return best;
              }

              private static int readU32LE(byte[] b, int o) {
                  return (b[o] & 0xFF) | ((b[o + 1] & 0xFF) << 8) | ((b[o + 2] & 0xFF) << 16) | ((b[o + 3] & 0xFF) << 24);
              }

              private static int readU32BE(byte[] b, int o) {
                  return ((b[o] & 0xFF) << 24) | ((b[o + 1] & 0xFF) << 16) | ((b[o + 2] & 0xFF) << 8) | (b[o + 3] & 0xFF);
              }

              private static String parseFlacLyrics(byte[] b) {
                  int pos = 4;
                  String best = "";
                  while (pos + 4 <= b.length) {
                      int hdr = b[pos] & 0xFF;
                      boolean isLast = (hdr & 0x80) != 0;
                      int type = hdr & 0x7F;
                      int len = ((b[pos + 1] & 0xFF) << 16) | ((b[pos + 2] & 0xFF) << 8) | (b[pos + 3] & 0xFF);
                      pos += 4;
                      if (pos + len > b.length) break;
                      if (type == 4 && len >= 8) {
                          int vLen = readU32LE(b, pos);
                          int cPos = pos + 4 + vLen;
                          if (cPos + 4 <= pos + len) {
                              int count = readU32LE(b, cPos);
                              cPos += 4;
                              for (int i = 0; i < count && cPos + 4 <= pos + len; i++) {
                                  int eLen = readU32LE(b, cPos);
                                  cPos += 4;
                                  if (eLen < 0 || cPos + eLen > pos + len) break;
                                  String entry = new String(b, cPos, eLen, StandardCharsets.UTF_8);
                                  cPos += eLen;
                                  int eq = entry.indexOf('=');
                                  if (eq > 0) {
                                      String k = entry.substring(0, eq).toUpperCase(Locale.ROOT);
                                      if ("LYRICS".equals(k) || "UNSYNCEDLYRICS".equals(k) || "SYNCEDLYRICS".equals(k) || "LRC".equals(k)) {
                                          String v = entry.substring(eq + 1).trim();
                                          if (v.length() > best.length()) best = v;
                                      }
                                  }
                              }
                          }
                      }
                      pos += len;
                      if (isLast) break;
                  }
                  return best;
              }

              private static String parseMp4Lyrics(byte[] b, int start, int end) {
                  int pos = start;
                  while (pos + 8 <= end) {
                      int size = readU32BE(b, pos);
                      if (size < 8 || pos + size > end) break;
                      int t0 = b[pos + 4] & 0xFF;
                      String type = new String(b, pos + 4, 4, StandardCharsets.ISO_8859_1);
                      int bodyStart = pos + 8 + ("meta".equals(type) ? 4 : 0);
                      int bodyEnd = pos + size;
                      if ("moov".equals(type) || "udta".equals(type) || "meta".equals(type) || "ilst".equals(type)) {
                          String found = parseMp4Lyrics(b, bodyStart, bodyEnd);
                          if (!found.isEmpty()) return found;
                      } else if (t0 == 0xA9 && b[pos + 5] == 'l' && b[pos + 6] == 'y' && b[pos + 7] == 'r') {
                          int inner = bodyStart;
                          while (inner + 16 <= bodyEnd) {
                              int dSize = readU32BE(b, inner);
                              String dType = new String(b, inner + 4, 4, StandardCharsets.ISO_8859_1);
                              if (dSize < 16 || inner + dSize > bodyEnd) break;
                              if ("data".equals(dType)) {
                                  String txt = new String(b, inner + 16, dSize - 16, StandardCharsets.UTF_8).trim();
                                  if (!txt.isEmpty()) return txt;
                              }
                              inner += dSize;
                          }
                      }
                      pos += size;
                  }
                  return "";
              }

              private void flushCoverBatch(JSONArray batch) {
                  try {
                      JSONObject payload = new JSONObject();
                      payload.put("items", batch);
                      dispatchJsonToWeb("__fengPatchTrackCovers", payload);
                  } catch (Exception ignored) {
                  }
              }

              private String encodeResizedCover(byte[] rawBytes) {
                  try {
                      BitmapFactory.Options opts = new BitmapFactory.Options();
                      opts.inJustDecodeBounds = true;
                      BitmapFactory.decodeByteArray(rawBytes, 0, rawBytes.length, opts);
                      int maxSide = Math.max(opts.outWidth, opts.outHeight);
                      int sample = 1;
                      while (maxSide / (sample * 2) >= 360) {
                          sample *= 2;
                      }
                      BitmapFactory.Options decOpts = new BitmapFactory.Options();
                      decOpts.inSampleSize = sample;
                      Bitmap bmp = BitmapFactory.decodeByteArray(rawBytes, 0, rawBytes.length, decOpts);
                      if (bmp == null) return "";
                      int w = bmp.getWidth();
                      int h = bmp.getHeight();
                      if (w > 360 || h > 360) {
                          float scale = Math.min(360f / w, 360f / h);
                          Bitmap scaled = Bitmap.createScaledBitmap(bmp, Math.max(1, Math.round(w * scale)), Math.max(1, Math.round(h * scale)), true);
                          if (scaled != bmp) bmp.recycle();
                          bmp = scaled;
                      }
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      bmp.compress(Bitmap.CompressFormat.JPEG, 78, baos);
                      bmp.recycle();
                      return "data:image/jpeg;base64," + Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                  } catch (Exception e) {
                      return "";
                  }
              }

              private String readSmallTextUri(Uri uri, long maxBytes) {
                  try (InputStream in = getContentResolver().openInputStream(uri)) {
                      if (in == null) return "";
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      long total = 0;
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          total += n;
                          if (total > maxBytes) return "";
                          baos.write(buf, 0, n);
                      }
                      return new String(baos.toByteArray(), StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "";
                  }
              }

              private String queryDisplayName(Uri uri) {
                  try (Cursor c = getContentResolver().query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null)) {
                      if (c != null && c.moveToFirst()) {
                          String name = c.getString(0);
                          if (name != null && !name.trim().isEmpty()) return name.trim();
                      }
                  } catch (Exception ignored) {
                  }
                  String seg = uri.getLastPathSegment();
                  if (seg == null) return "";
                  int slash = seg.lastIndexOf('/');
                  return slash >= 0 ? seg.substring(slash + 1) : seg;
              }

              private static String getFileExt(String name) {
                  int dot = name.lastIndexOf('.');
                  if (dot < 0 || dot == name.length() - 1) return "";
                  return name.substring(dot + 1).toLowerCase(Locale.ROOT);
              }

              private static String stripExt(String name) {
                  int dot = name.lastIndexOf('.');
                  return dot > 0 ? name.substring(0, dot) : name;
              }

              private static String safeMeta(String s) {
                  return s == null ? "" : s.trim();
              }

              private static String extractYear(String raw) {
                  if (raw == null || raw.isEmpty()) return "";
                  Matcher m = YEAR_PATTERN.matcher(raw);
                  return m.find() ? m.group(1) : "";
              }
          }
