              }

              func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                  self.activeFolderPicker = nil
                  if isExportingDocument {
                      isExportingDocument = false
                      reportExportResult(true)
                      return
                  }
                  if isPickingAudioFiles {
                      isPickingAudioFiles = false
                      handlePickedAudioFilesCopy(urls)
                      return
                  }

                  guard let pickedURL = urls.first else {
                      reportFolderPickerStatus("未获取到所选文件夹路径")
                      return
                  }

                  let granted = pickedURL.startAccessingSecurityScopedResource()
                  let canonicalKey = pickedURL.standardizedFileURL.path
                  if let old = activeScopedURLs[canonicalKey], old != pickedURL {
                      old.stopAccessingSecurityScopedResource()
                  }
                  activeScopedURLs[canonicalKey] = pickedURL

                  if let bookmarkData = try? pickedURL.bookmarkData(
                      options: [],
                      includingResourceValuesForKeys: nil,
                      relativeTo: nil
                  ) {
                      var dict = UserDefaults.standard.dictionary(forKey: bookmarkDefaultsKey) as? [String: Data] ?? [:]
                      dict[canonicalKey] = bookmarkData
                      UserDefaults.standard.set(dict, forKey: bookmarkDefaultsKey)
                  }

                  pushBoundFoldersSummary()
                  let folderName = pickedURL.lastPathComponent
                  reportFolderPickerStatus("已选中「\(folderName)」，正在扫描音频...")

                  DispatchQueue.global(qos: .userInitiated).async {
                      let payload = self.enumerateFolderURL(pickedURL, folderName: folderName, silent: false, granted: granted)
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.2) {
                          self.dispatchFolderPayloadToWeb(payload)
                      }
                  }
              }

              private func handlePickedAudioFilesCopy(_ urls: [URL]) {
                  guard !urls.isEmpty else { return }
                  reportFolderPickerStatus("正在将 \(urls.count) 个文件永久导入 FENG MUSIC...")
                  DispatchQueue.global(qos: .userInitiated).async {
                      guard let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first else {
                          self.dispatchNamedPayloadToWeb("__fengImportedNativeFiles", payload: ["count": 0, "error": "无法访问应用文稿目录"])
                          return
                      }
                      let musicDir = docs.appendingPathComponent("Music", isDirectory: true)
                      try? FileManager.default.createDirectory(at: musicDir, withIntermediateDirectories: true)

                      let allowedExts: Set<String> = ["mp3", "flac", "m4a", "wav", "aac", "lrc"]
                      var imported = 0
                      var skippedOgg = 0

                      for srcURL in urls {
                          let ext = srcURL.pathExtension.lowercased()
                          if ext == "ogg" {
                              skippedOgg += 1
                              continue
                          }
                          guard allowedExts.contains(ext) else { continue }
                          let accessed = srcURL.startAccessingSecurityScopedResource()
                          defer { if accessed { srcURL.stopAccessingSecurityScopedResource() } }
                          let destURL = musicDir.appendingPathComponent(srcURL.lastPathComponent)
                          do {
                              if FileManager.default.fileExists(atPath: destURL.path) {
                                  try FileManager.default.removeItem(at: destURL)
                              }
                              try FileManager.default.copyItem(at: srcURL, to: destURL)
                              imported += 1
                          } catch {}
                      }
                      self.dispatchNamedPayloadToWeb("__fengImportedNativeFiles", payload: [
                          "count": imported,
                          "skippedOgg": skippedOgg
                      ])
                  }
              }

              func restoreSecurityScopedBookmarks() {
                  guard let dict = UserDefaults.standard.dictionary(forKey: bookmarkDefaultsKey) as? [String: Data],
                        !dict.isEmpty else { return }
                  var updatedDict = dict
                  var didRefreshStale = false

                  for (key, bmData) in dict {
                      if activeScopedURLs[key] != nil { continue }
                      var isStale = false
                      if let resolvedURL = try? URL(
                          resolvingBookmarkData: bmData,
                          options: [],
                          relativeTo: nil,
                          bookmarkDataIsStale: &isStale
                      ) {
                          let canonicalPath = resolvedURL.standardizedFileURL.path
                          if activeScopedURLs[canonicalPath] != nil { continue }
                          _ = resolvedURL.startAccessingSecurityScopedResource()
                          activeScopedURLs[canonicalPath] = resolvedURL
                          if isStale,
                             let freshData = try? resolvedURL.bookmarkData(options: [], includingResourceValuesForKeys: nil, relativeTo: nil) {
                              updatedDict[key] = freshData
                              didRefreshStale = true
                          }
                      }
                  }
                  if didRefreshStale {
                      UserDefaults.standard.set(updatedDict, forKey: bookmarkDefaultsKey)
                  }
              }

              private func rescanAllBookmarkedFolders(silent: Bool) {
                  pushBoundFoldersSummary()
                  let urls = Array(activeScopedURLs.values)
                  guard !urls.isEmpty else { return }
                  DispatchQueue.global(qos: .userInitiated).async {
                      for folderURL in urls {
                          let payload = self.enumerateFolderURL(
                              folderURL,
                              folderName: folderURL.lastPathComponent,
                              silent: silent,
                              granted: true
                          )
                          self.dispatchFolderPayloadToWeb(payload)
                      }
                  }
              }

              private func extractTextMetadata(from asset: AVURLAsset) -> (title: String, artist: String, album: String) {
                  var title = ""
                  var artist = ""
                  var album = ""
                  for item in asset.commonMetadata {
                      guard let key = item.commonKey else { continue }
                      let val = (item.stringValue ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                      if val.isEmpty { continue }
                      if key == .commonKeyTitle && title.isEmpty { title = val }
                      else if key == .commonKeyArtist && artist.isEmpty { artist = val }
                      else if key == .commonKeyAlbumName && album.isEmpty { album = val }
                  }
                  return (title, artist, album)
              }

              private func extractArtworkDataURL(from asset: AVURLAsset) -> String {
                  for item in asset.commonMetadata where item.commonKey == .commonKeyArtwork {
                      if let rawData = item.dataValue, let img = UIImage(data: rawData) {
                          let maxDim: CGFloat = 360
                          let maxSide = max(img.size.width, img.size.height)
                          let scale = maxSide > maxDim ? (maxDim / maxSide) : 1.0
                          let targetSize = CGSize(
                              width: max(1, round(img.size.width * scale)),
                              height: max(1, round(img.size.height * scale))
                          )
                          let renderer = UIGraphicsImageRenderer(size: targetSize)
                          let resized = renderer.image { _ in
                              img.draw(in: CGRect(origin: .zero, size: targetSize))
                          }
                          if let jpeg = resized.jpegData(compressionQuality: 0.78) {
                              return "data:image/jpeg;base64," + jpeg.base64EncodedString()
                          }
                      }
                  }
                  return ""
              }

              private func patchMetadataAndCoversInBackground(items: [(url: URL, uri: String, relKey: String)]) {
                  guard !items.isEmpty else { return }
                  DispatchQueue.global(qos: .utility).async {
                      var batch: [[String: String]] = []
                      for item in items {
                          let asset = AVURLAsset(url: item.url)
                          let meta = self.extractTextMetadata(from: asset)
                          let cover = self.extractArtworkDataURL(from: asset)
                          if !meta.title.isEmpty || !meta.artist.isEmpty || !meta.album.isEmpty || !cover.isEmpty {
                              batch.append([
                                  "relKey": item.relKey,
                                  "uri": item.uri,
                                  "title": meta.title,
                                  "artist": meta.artist,
                                  "album": meta.album,
                                  "cover": cover
                              ])
                          }
                          if batch.count >= 6 {
                              let chunk = batch
                              batch.removeAll()
                              self.dispatchNamedPayloadToWeb("__fengPatchTrackCovers", payload: ["items": chunk])
                          }
                      }
                      if !batch.isEmpty {
                          self.dispatchNamedPayloadToWeb("__fengPatchTrackCovers", payload: ["items": batch])
                      }
                  }
              }

              private func enumerateFolderURL(_ url: URL, folderName: String, silent: Bool, granted: Bool) -> [String: Any] {
                  let audioExts: Set<String> = ["mp3", "flac", "m4a", "wav", "aac"]
                  var lrcMap: [String: String] = [:]
                  var audioItems: [(url: URL, name: String, uri: String, relKey: String, base: String)] = []
                  var enumError = ""
                  var icloudPlaceholderCount = 0

                  let scanDirectory: (URL) -> Void = { targetURL in
                      let rootPath = targetURL.standardizedFileURL.path
                      if let enumerator = FileManager.default.enumerator(
                          at: targetURL,
                          includingPropertiesForKeys: [.isRegularFileKey, .isDirectoryKey],
                          options: [],
                          errorHandler: { _, err -> Bool in
                              if enumError.isEmpty {
                                  enumError = err.localizedDescription
                              }
                              return true
                          }
                      ) {
                          for case let fileURL as URL in enumerator {
                              let fileName = fileURL.lastPathComponent
                              if fileName.hasSuffix(".icloud") {
                                  icloudPlaceholderCount += 1
                                  continue
                              }
                              if fileName.hasPrefix(".") { continue }
                              let ext = fileURL.pathExtension.lowercased()
                              let base = fileURL.deletingPathExtension().lastPathComponent
                                  .trimmingCharacters(in: .whitespacesAndNewlines)
                                  .lowercased()
                              if ext == "lrc" {
                                  if let txt = try? String(contentsOf: fileURL, encoding: .utf8) {
                                      lrcMap[base] = txt
                                  }
                              } else if audioExts.contains(ext) {
                                  let fullPath = fileURL.standardizedFileURL.path
                                  let relSuffix = fullPath.hasPrefix(rootPath)
                                      ? String(fullPath.dropFirst(rootPath.count)).trimmingCharacters(in: CharacterSet(charactersIn: "/"))
                                      : fileName
                                  let relKey = "\(folderName)/\(relSuffix)"
                                  audioItems.append((
                                      url: fileURL,
                                      name: fileName,
                                      uri: fileURL.absoluteString,
                                      relKey: relKey,
                                      base: base
                                  ))
                              }
                          }
                      }
                  }

                  // Use NSFileCoordinator so iOS File Provider & iCloud Drive folders grant read access cleanly.
                  var coordError: NSError?
                  var didCoordinate = false
                  let coordinator = NSFileCoordinator()
                  coordinator.coordinate(readingItemAt: url, options: [.withoutChanges], error: &coordError) { coordinatedURL in
                      didCoordinate = true
                      scanDirectory(coordinatedURL)
                  }
                  if !didCoordinate {
                      if let ce = coordError, enumError.isEmpty {
                          enumError = ce.localizedDescription
                      }
                      scanDirectory(url)
                  }

                  if audioItems.isEmpty && enumError.isEmpty {
                      if icloudPlaceholderCount > 0 {
                          enumError = "发现 \(icloudPlaceholderCount) 个未下载的 iCloud 云端文件，请先在「文件」App 点击下载"
                      } else if !granted {
                          enumError = "系统未授予该目录的跨应用读取权限（第三方网盘目录可能不支持，建议使用「单曲/歌词」永久入库）"
                      }
                  }

                  // Return file list immediately (<50ms); extract ID3/FLAC/M4A metadata & covers asynchronously.
                  let filesPayload: [[String: String]] = audioItems.map { item in
                      [
                          "name": item.name,
                          "uri": item.uri,
                          "relKey": item.relKey,
                          "lrc": lrcMap[item.base] ?? ""
                      ]
                  }

                  let bgTargets = audioItems.map { (url: $0.url, uri: $0.uri, relKey: $0.relKey) }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) {
                      self.patchMetadataAndCoversInBackground(items: bgTargets)
                  }

                  return [
                      "cancelled": false,
                      "silent": silent,
                      "granted": granted,
                      "folderName": folderName,
                      "error": enumError,
                      "files": filesPayload
                  ]
              }

              private func dispatchFolderPayloadToWeb(_ payload: [String: Any]) {
                  dispatchJSONToWeb("__fengPickedFolderFiles", payload: payload)
              }

              private func dispatchNamedPayloadToWeb(_ fnName: String, payload: [String: Any]) {
                  dispatchJSONToWeb(fnName, payload: payload)
              }

              // Bound-folder list for the settings UI. Keys are the standardized
              // folder paths used everywhere else in this bridge (v3 store).
              private func pushBoundFoldersSummary() {
                  let dict = UserDefaults.standard.dictionary(forKey: bookmarkDefaultsKey) as? [String: Data] ?? [:]
                  var folders: [[String: Any]] = []
                  for key in dict.keys.sorted() {
                      let name = (key as NSString).lastPathComponent
                      let active = activeScopedURLs[key] != nil
                      folders.append(["key": key, "name": name, "active": active])
                  }
                  dispatchNamedPayloadToWeb("__fengBoundFolders", payload: ["folders": folders])
              }

              private func removeBookmarkedFolder(key: String) {
                  if let u = activeScopedURLs.removeValue(forKey: key) {
                      u.stopAccessingSecurityScopedResource()
                  }
                  var dict = UserDefaults.standard.dictionary(forKey: bookmarkDefaultsKey) as? [String: Data] ?? [:]
                  dict.removeValue(forKey: key)
                  UserDefaults.standard.set(dict, forKey: bookmarkDefaultsKey)
                  pushBoundFoldersSummary()
              }

              private func sendEvent(_ type: String, extra: [String: Any]) {
                  var jsonStr = "{}"
                  if let data = try? JSONSerialization.data(withJSONObject: extra, options: []),
                     let s = String(data: data, encoding: .utf8) {
                      jsonStr = s
                  }
                  DispatchQueue.main.async {
                      self.webView?.evaluateJavaScript("window.__fengNativeAudioEvent && window.__fengNativeAudioEvent('\(type)', \(jsonStr))", completionHandler: nil)
                  }
              }

              private func resolvedAppGroupID() -> String {
                  if let id = Bundle.main.object(forInfoDictionaryKey: "FengAppGroup") as? String, !id.isEmpty {
                      return id
                  }
                  return "group.78G3Q25PQG.1iKc"
              }

              private func registerWidgetCommandObserver() {
                  guard !widgetDarwinRegistered else { return }
                  widgetDarwinRegistered = true
                  let callback: CFNotificationCallback = { _, observer, name, _, _ in
                      guard let observer = observer, let cfName = name else { return }
                      let bridge = Unmanaged<FengRemoteMediaBridge>.fromOpaque(observer).takeUnretainedValue()
                      let str = cfName.rawValue as String
                      if str.hasSuffix(".toggle") {
                          bridge.executeWidgetCommand("toggle")
                      } else if str.hasSuffix(".next") {
                          bridge.executeWidgetCommand("next")
                      } else if str.hasSuffix(".prev") {
                          bridge.executeWidgetCommand("prev")
                      }
                  }
                  let observerPtr = Unmanaged.passUnretained(self).toOpaque()
                  let center = CFNotificationCenterGetDarwinNotifyCenter()
                  for suffix in ["toggle", "next", "prev"] {
                      CFNotificationCenterAddObserver(
                          center,
                          observerPtr,
                          callback,
                          "com.feng.music.widget.\(suffix)" as CFString,
                          nil,
                          .deliverImmediately
                      )
                  }
              }

              func executeWidgetCommand(_ cmd: String) {
                  DispatchQueue.main.async {
                      if cmd == "toggle" {
                          if let p = self.player {
                              if p.rate > 0 {
                                  p.pause()
                                  self.updateNowPlayingInfo()
                                  self.sendEvent("pause", extra: [:])
                              } else {
                                  try? AVAudioSession.sharedInstance().setActive(true)
                                  p.play()
                                  p.rate = self.currentRate
                                  self.updateNowPlayingInfo()
                                  self.sendEvent("play", extra: [:])
                              }
                          } else {
                              self.webView?.evaluateJavaScript("var b = document.getElementById('btn-mini-play'); if (b) b.click();", completionHandler: nil)
                          }
                      } else if cmd == "next" {
                          self.webView?.evaluateJavaScript("window.__fengNextTrack && window.__fengNextTrack()", completionHandler: nil)
                      } else if cmd == "prev" {
                          self.webView?.evaluateJavaScript("window.__fengPrevTrack && window.__fengPrevTrack()", completionHandler: nil)
                      }
                  }
              }

              func handleDeepLink(_ url: URL) {
                  guard url.scheme?.lowercased() == "fengmusic" else { return }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.25) {
                      self.webView?.evaluateJavaScript("window.__fengOpenNowPlaying && window.__fengOpenNowPlaying()", completionHandler: nil)
                  }
              }

              private func triggerTargetedWidgetReloadNow() {
                  var bgTask: UIBackgroundTaskIdentifier = .invalid
                  bgTask = UIApplication.shared.beginBackgroundTask(withName: "FengWidgetReload") {
                      if bgTask != .invalid {
                          UIApplication.shared.endBackgroundTask(bgTask)
                          bgTask = .invalid
                      }
                  }
                  if #available(iOS 14.0, *) {
                      WidgetCenter.shared.reloadTimelines(ofKind: "FengNowPlayingWidget")
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                      if bgTask != .invalid {
                          UIApplication.shared.endBackgroundTask(bgTask)
                          bgTask = .invalid
                      }
                  }
              }

              private func syncWidgetState(saveCover: Bool = false) {
                  let groupID = resolvedAppGroupID()
                  guard let defaults = UserDefaults(suiteName: groupID) else { return }
                  let isPlaying = (player?.rate ?? 0) > 0
                  let elapsed = player.map { CMTimeGetSeconds($0.currentTime()) } ?? 0
                  let safeElapsed = elapsed.isFinite && elapsed >= 0 ? elapsed : 0
                  let rateVal = Double(max(currentRate, 0.5))
                  let remaining = (isPlaying && currentDuration > safeElapsed + 1.0)
                      ? ((currentDuration - safeElapsed) / rateVal)
                      : 0

                  defaults.set(currentTitle, forKey: "widget_title")
                  defaults.set(currentArtist, forKey: "widget_artist")
                  defaults.set(currentAlbum, forKey: "widget_album")
                  defaults.set(isPlaying, forKey: "widget_isPlaying")
                  defaults.set(Date().timeIntervalSince1970, forKey: "widget_updatedAt")
                  if remaining > 0 {
                      defaults.set(Date().timeIntervalSince1970 + remaining + 1.8, forKey: "widget_expectedEndAt")
                  } else {
                      defaults.removeObject(forKey: "widget_expectedEndAt")
                  }

                  if saveCover,
                     let containerURL = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: groupID) {
                      let prevFile = defaults.string(forKey: "widget_cover_file")
                      if let img = currentCoverImage {
                          let maxDim: CGFloat = 300
                          let maxSide = max(img.size.width, img.size.height)
                          let scale = maxSide > maxDim ? (maxDim / maxSide) : 1.0
                          let targetSize = CGSize(
                              width: max(1, round(img.size.width * scale)),
                              height: max(1, round(img.size.height * scale))
                          )
                          let renderer = UIGraphicsImageRenderer(size: targetSize)
                          let resized = renderer.image { _ in
                              img.draw(in: CGRect(origin: .zero, size: targetSize))
                          }
                          if let data = resized.jpegData(compressionQuality: 0.78) {
                              let newName = "widget_cover_\(Int(Date().timeIntervalSince1970 * 1000)).jpg"
                              let newURL = containerURL.appendingPathComponent(newName)
                              if (try? data.write(to: newURL, options: .atomic)) != nil {
                                  defaults.set(newName, forKey: "widget_cover_file")
                                  if let old = prevFile, old != newName {
                                      try? FileManager.default.removeItem(at: containerURL.appendingPathComponent(old))
                                  }
                                  try? data.write(to: containerURL.appendingPathComponent("widget_cover.jpg"), options: .atomic)
                              }
                          }
                      } else {
                          defaults.removeObject(forKey: "widget_cover_file")
                          if let old = prevFile {
                              try? FileManager.default.removeItem(at: containerURL.appendingPathComponent(old))
                          }
                          try? FileManager.default.removeItem(at: containerURL.appendingPathComponent("widget_cover.jpg"))
                      }
                  }
                  defaults.synchronize()
                  triggerTargetedWidgetReloadNow()
              }

              private func updateNowPlayingInfo(saveCoverToWidget: Bool = false) {
                  var info: [String: Any] = [
                      MPMediaItemPropertyTitle: currentTitle,
                      MPMediaItemPropertyArtist: currentArtist,
                      MPMediaItemPropertyAlbumTitle: currentAlbum,
                      MPNowPlayingInfoPropertyElapsedPlaybackTime: player.map { CMTimeGetSeconds($0.currentTime()) } ?? 0,
                      MPMediaItemPropertyPlaybackDuration: currentDuration,
                      MPNowPlayingInfoPropertyPlaybackRate: (player?.rate ?? 0) > 0 ? Double(currentRate) : 0.0
                  ]
                  if let art = currentArtwork {
                      info[MPMediaItemPropertyArtwork] = art
                  }
                  MPNowPlayingInfoCenter.default().nowPlayingInfo = info
                  syncWidgetState(saveCover: saveCoverToWidget)
              }

              private func cleanupPlayer() {
                  if let obs = timeObserver, let p = player {
                      p.removeTimeObserver(obs)
                  }
                  timeObserver = nil
                  if let eObs = endObserver {
                      NotificationCenter.default.removeObserver(eObs)
                  }
                  endObserver = nil
                  if let fObs = failedObserver {
                      NotificationCenter.default.removeObserver(fObs)
                  }
                  failedObserver = nil
                  player?.pause()
                  player = nil
              }

              private func decodeArtwork(from coverStr: String) -> MPMediaItemArtwork? {
                  if coverStr.hasPrefix("data:image"),
                     let comma = coverStr.firstIndex(of: ",") {
                      let b64 = String(coverStr[coverStr.index(after: comma)...])
                      if let data = Data(base64Encoded: b64, options: .ignoreUnknownCharacters),
                         let img = UIImage(data: data) {
                          self.currentCoverImage = img
                          return MPMediaItemArtwork(boundsSize: img.size) { _ in img }
                      }
                  }
                  if let img = UIImage(named: "AppIcon") ?? UIImage(contentsOfFile: Bundle.main.path(forResource: "icon-512", ofType: "png", inDirectory: "public") ?? "") {
                      self.currentCoverImage = img
                      return MPMediaItemArtwork(boundsSize: img.size) { _ in img }
                  }
                  self.currentCoverImage = nil
                  return nil
              }

              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  if message.name == "fengExport" {
                      if let body = message.body as? [String: Any],
                         let filename = body["filename"] as? String,
                         let content = body["content"] as? String {
                          exportDocument(filename: filename, content: content)
                      }
                      return
                  }

                  if message.name == "fengFolder" {
                      if let body = message.body as? [String: Any],
                         let action = body["action"] as? String {
                          if action == "rescanBookmarks" {
                              let silent = (body["silent"] as? Bool) ?? true
                              rescanAllBookmarkedFolders(silent: silent)
                          } else if action == "listBookmarks" {
                              pushBoundFoldersSummary()
                          } else if action == "removeBookmark", let key = body["key"] as? String {
                              removeBookmarkedFolder(key: key)
                          } else if action == "pickAudioFiles" {
                              presentAudioFilesPicker()
                          } else {
                              presentFolderPicker()
                          }
                      } else {
                          presentFolderPicker()
                      }
                      return
                  }

                  if message.name == "fengDock", let body = message.body as? [String: Any] {
                      if let tab = body["tab"] as? String {
                          DispatchQueue.main.async { self.selectNativeTab(tab) }
                      }
                      let hidden = (body["hidden"] as? Bool) ?? isTabBarHidden
                      let collapsed = (body["collapsed"] as? Bool) ?? isTabBarCollapsed
                      setDockVisibility(hidden: hidden, collapsed: collapsed)
                      return
                  }

                  guard message.name == "fengAudio",
                        let body = message.body as? [String: Any],
                        let action = body["action"] as? String else { return }

                  if action == "load" {
                      guard let urlStr = body["url"] as? String,
                            let url = URL(string: urlStr) else { return }
                      cleanupPlayer()
                      currentTitle = (body["title"] as? String) ?? "FENG MUSIC"
                      currentArtist = (body["artist"] as? String) ?? ""
                      currentAlbum = (body["album"] as? String) ?? ""
                      currentRate = Float((body["rate"] as? Double) ?? 1.0)
                      pendingResumeTime = (body["resumeTime"] as? Double) ?? 0
                      currentDuration = 0
                      didSendMeta = false
                      didSendError = false
                      currentArtwork = decodeArtwork(from: (body["cover"] as? String) ?? "")

                      let item = AVPlayerItem(url: url)
                      let newPlayer = AVPlayer(playerItem: item)
                      self.player = newPlayer

                      endObserver = NotificationCenter.default.addObserver(forName: .AVPlayerItemDidPlayToEndTime, object: item, queue: .main) { [weak self] _ in
                          self?.updateNowPlayingInfo()
                          self?.sendEvent("ended", extra: [:])
                      }

                      failedObserver = NotificationCenter.default.addObserver(forName: .AVPlayerItemFailedToPlayToEndTime, object: item, queue: .main) { [weak self] note in
                          guard let self = self, !self.didSendError else { return }
                          self.didSendError = true
                          let errMsg = (note.userInfo?[AVPlayerItemFailedToPlayToEndTimeErrorKey] as? Error)?.localizedDescription ?? "音频播放失败"
                          self.updateNowPlayingInfo()
                          self.sendEvent("error", extra: ["message": errMsg])
                      }

                      timeObserver = newPlayer.addPeriodicTimeObserver(forInterval: CMTime(seconds: 0.25, preferredTimescale: 600), queue: .main) { [weak self] cmTime in
                          guard let self = self else { return }
                          if !self.didSendError && item.status == .failed {
                              self.didSendError = true
                              let errMsg = item.error?.localizedDescription ?? "无法解码该音频文件或授权已失效"
                              self.updateNowPlayingInfo()
                              self.sendEvent("error", extra: ["message": errMsg])
                              return
                          }
                          if !self.didSendMeta && item.status == .readyToPlay {
                              let dur = CMTimeGetSeconds(item.duration)
                              if dur.isFinite && dur > 0 {
                                  self.didSendMeta = true
                                  self.currentDuration = dur
                                  if self.pendingResumeTime > 0 && self.pendingResumeTime < dur - 1 {
                                      newPlayer.seek(to: CMTime(seconds: self.pendingResumeTime, preferredTimescale: 600)) { [weak self] _ in
                                          DispatchQueue.main.async { self?.updateNowPlayingInfo() }
                                      }
                                      self.pendingResumeTime = 0
                                  } else {
                                      self.updateNowPlayingInfo(saveCoverToWidget: true)
                                  }
                                  self.sendEvent("loadedmetadata", extra: ["duration": dur])
                              }
                          }
                          let cur = CMTimeGetSeconds(cmTime)
                          if cur.isFinite {
                              self.sendEvent("timeupdate", extra: ["currentTime": cur, "duration": self.currentDuration])
                          }
                      }

                      let autoPlay = (body["autoPlay"] as? Bool) ?? false
                      if autoPlay {
                          newPlayer.play()
                          newPlayer.rate = currentRate
                          updateNowPlayingInfo(saveCoverToWidget: true)
                          sendEvent("play", extra: [:])
                          sendEvent("playing", extra: [:])
                      } else {
                          updateNowPlayingInfo(saveCoverToWidget: true)
                      }
                  } else if action == "play" {
                      player?.play()
                      player?.rate = currentRate
                      updateNowPlayingInfo()
                  } else if action == "pause" {
                      player?.pause()
                      updateNowPlayingInfo()
                  } else if action == "seek" {
                      let t = (body["time"] as? Double) ?? 0
                      player?.seek(to: CMTime(seconds: t, preferredTimescale: 600)) { [weak self] _ in
                          DispatchQueue.main.async { self?.updateNowPlayingInfo() }
                      }
                  } else if action == "rate" {
                      currentRate = Float((body["rate"] as? Double) ?? 1.0)
                      if (player?.rate ?? 0) != 0 {
                          player?.rate = currentRate
                      }
                      updateNowPlayingInfo()
                  } else if action == "stop" {
                      cleanupPlayer()
                      MPNowPlayingInfoCenter.default().nowPlayingInfo = nil
                  }
              }
          }

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  FengRemoteMediaBridge.shared.configureAudioAndCommands()
                  FengRemoteMediaBridge.shared.restoreSecurityScopedBookmarks()
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.1) {
                      FengRemoteMediaBridge.shared.attach(window: self.window)
                  }
                  return true
              }

              func applicationDidBecomeActive(_ application: UIApplication) {
                  FengRemoteMediaBridge.shared.restoreSecurityScopedBookmarks()
                  FengRemoteMediaBridge.shared.attach(window: window)
              }

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  if url.scheme?.lowercased() == "fengmusic" {
                      FengRemoteMediaBridge.shared.handleDeepLink(url)
                      return true
                  }
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          EOF

