                          if hasLiveSync, let uiImage = coverImage {
                              Image(uiImage: uiImage)
                                  .resizable()
                                  .aspectRatio(contentMode: .fill)
                                  .frame(width: geo.size.width, height: geo.size.height)
                                  .blur(radius: 28)
                                  .scaleEffect(1.25)
                                  .opacity(0.28)
                          }

                          // Flowing cyan & sky-blue caustic light ribbons echoing icon-512
                          Circle()
                              .fill(
                                  RadialGradient(
                                      colors: [FengGlassPalette.aqua.opacity(0.52), FengGlassPalette.sky.opacity(0.18), .clear],
                                      center: .center,
                                      startRadius: 4,
                                      endRadius: geo.size.width * 0.62
                                  )
                              )
                              .frame(width: geo.size.width * 0.95, height: geo.size.width * 0.95)
                              .offset(x: geo.size.width * 0.36, y: -geo.size.height * 0.38)
                              .blur(radius: 16)

                          Circle()
                              .fill(
                                  RadialGradient(
                                      colors: [FengGlassPalette.sky.opacity(0.46), FengGlassPalette.aqua.opacity(0.16), .clear],
                                      center: .center,
                                      startRadius: 4,
                                      endRadius: geo.size.width * 0.58
                                  )
                              )
                              .frame(width: geo.size.width * 0.9, height: geo.size.width * 0.9)
                              .offset(x: -geo.size.width * 0.38, y: geo.size.height * 0.42)
                              .blur(radius: 18)

                          // Top-left liquid lens specular sheen
                          LinearGradient(
                              colors: [
                                  Color.white.opacity(0.75),
                                  Color.white.opacity(0.18),
                                  Color.clear
                              ],
                              startPoint: .topLeading,
                              endPoint: .center
                          )

                          // Inner refractive crystal rim
                          RoundedRectangle(cornerRadius: 24, style: .continuous)
                              .strokeBorder(
                                  LinearGradient(
                                      colors: [
                                          Color.white.opacity(0.95),
                                          FengGlassPalette.aqua.opacity(0.45),
                                          FengGlassPalette.sky.opacity(0.40),
                                          Color.white.opacity(0.80)
                                      ],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  ),
                                  lineWidth: 1.5
                              )
                              .padding(1)
                      }
                  }
              }
          }

          struct LiquidGlassIconStage: View {
              let image: UIImage?
              let size: CGFloat
              let cornerRadius: CGFloat

              var body: some View {
                  ZStack {
                      // Soft sky-blue ambient glow behind icon
                      RoundedRectangle(cornerRadius: cornerRadius, style: .continuous)
                          .fill(FengGlassPalette.sky.opacity(0.28))
                          .frame(width: size * 0.92, height: size * 0.92)
                          .blur(radius: 10)
                          .offset(y: 4)

                      Group {
                          if let uiImage = image {
