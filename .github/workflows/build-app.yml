          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class FengMediaKeepAliveService extends Service {
              public static final String ACTION_START_OR_UPDATE = "FENG_MEDIA_KEEPALIVE_UPDATE";
              private static final String CHANNEL_ID = "feng_music_playback";
              private static final int NOTIF_ID = 7001;

              private PowerManager.WakeLock wakeLock;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String title = intent != null ? intent.getStringExtra("title") : null;
                  String artist = intent != null ? intent.getStringExtra("artist") : null;
                  if (title == null || title.isEmpty()) title = "FENG MUSIC";
                  if (artist == null) artist = "";

                  ensureChannel();
                  Notification notif = buildNotification(title, artist);
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(NOTIF_ID, notif);
                      }
                  } catch (Exception ignored) {
                      try {
                          startForeground(NOTIF_ID, notif);
                      } catch (Exception ignored2) {}
                  }
                  acquireWakeLock();
                  return START_NOT_STICKY;
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  releaseWakeLock();
                  stopForeground(true);
                  stopSelf();
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  releaseWakeLock();
                  stopForeground(true);
                  super.onDestroy();
              }

              private void ensureChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null && nm.getNotificationChannel(CHANNEL_ID) == null) {
                          NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID,
                              "音乐后台播放",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          ch.setDescription("保持 FENG MUSIC 在后台与锁屏时持续播放");
                          ch.setShowBadge(false);
                          ch.setSound(null, null);
                          nm.createNotificationChannel(ch);
                      }
                  }
              }

              private Notification buildNotification(String title, String artist) {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.putExtra(MainActivity.EXTRA_WIDGET_OPEN, "nowplaying");
                  openIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentPi = PendingIntent.getActivity(
                      this, 200, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  String pkg = getPackageName();
                  PendingIntent prevPi = buildBroadcastAction(pkg + ".WIDGET_PREV", 201);
                  PendingIntent togglePi = buildBroadcastAction(pkg + ".WIDGET_TOGGLE", 202);
                  PendingIntent nextPi = buildBroadcastAction(pkg + ".WIDGET_NEXT", 203);

                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);

                  builder
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle(title)
                      .setContentText(artist.isEmpty() ? "正在后台播放" : artist)
                      .setContentIntent(contentPi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .addAction(new Notification.Action.Builder(R.drawable.ic_widget_prev, "上一首", prevPi).build())
                      .addAction(new Notification.Action.Builder(R.drawable.ic_widget_pause, "暂停", togglePi).build())
                      .addAction(new Notification.Action.Builder(R.drawable.ic_widget_next, "下一首", nextPi).build());

                  return builder.build();
              }

              private PendingIntent buildBroadcastAction(String action, int reqCode) {
                  Intent i = new Intent(this, FengWidgetProvider.class);
                  i.setAction(action);
                  return PendingIntent.getBroadcast(
                      this, reqCode, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
              }

              private void acquireWakeLock() {
                  try {
                      if (wakeLock == null) {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          if (pm != null) {
                              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, getPackageName() + ":FengPlaybackWakeLock");
                              wakeLock.setReferenceCounted(false);
                          }
                      }
                      if (wakeLock != null && !wakeLock.isHeld()) {
                          wakeLock.acquire(4 * 60 * 60 * 1000L);
                      }
                  } catch (Exception ignored) {}
              }

              private void releaseWakeLock() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  } catch (Exception ignored) {}
              }
          }
