              // Native iOS UITabBar Liquid Glass Dock + Collapsed Circle Pill
              private var nativeTabBar: UITabBar?
              private var collapsedPillView: UIView?
              private var collapsedPillBtn: UIButton?
              private var tabItems: [UITabBarItem] = []
              private let tabIds = ["library", "playlists", "stats", "diy"]
              private let tabSymbols = ["music.note", "rectangle.stack.fill", "chart.bar.fill", "gearshape.fill"]
              private var activeTabId = "library"
