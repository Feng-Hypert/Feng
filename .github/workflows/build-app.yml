          struct LiquidGlassWaveGlyph: View {
              var body: some View {
                  HStack(alignment: .center, spacing: 3) {
                      ForEach([0.45, 0.85, 1.0, 0.65, 0.40], id: \.self) { ratio in
                          Capsule()
