                      }
                      guard let presenter = self.topMostViewController(), presenter.viewIfLoaded?.window != nil else {
                          self.reportFolderPickerStatus("无法定位当前页面，请退出后重新打开 FENG MUSIC")
                          return
                      }
                      if #available(iOS 14.0, *) {
                          // iOS requires the 1-argument init(forOpeningContentTypes:) without asCopy for .folder;
                          // passing asCopy: false or mutating file-only flags breaks the "Open" button in DOCRemoteViewController.
                          let picker = UIDocumentPickerViewController(forOpeningContentTypes: [.folder])
