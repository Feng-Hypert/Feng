          struct FengWidgetEntryView: View {
              @Environment(\.widgetFamily) var family
              let entry: FengWidgetEntry

              var body: some View {
                  Group {
                      if family == .systemSmall {
                          smallBody
                      } else {
                          mediumBody
                      }
                  }
                  .widgetURL(URL(string: "fengmusic://nowplaying"))
                  .modifier(AlbumAdaptiveContainerBackground(
                      coverImage: entry.coverImage,
                      hasLiveSync: entry.hasLiveSync,
                      cornerRadius: family == .systemSmall ? 22 : 24
                  ))
              }

              private var smallBody: some View {
                  VStack(spacing: 8) {
                      HStack(alignment: .center) {
                          ZStack(alignment: .leading) {
                              PeekingVinylDisc(diameter: 50, active: entry.isPlaying)
                                  .offset(x: entry.isPlaying ? 18 : 8)
                              SuperellipseCoverView(image: entry.coverImage, size: 54, cornerRadius: 15)
                          }
                          .frame(width: 72, height: 56, alignment: .leading)

                          Spacer(minLength: 4)

                          ZStack {
                              Circle()
                                  .fill(Color.white.opacity(entry.isPlaying ? 0.24 : 0.14))
                                  .frame(width: 34, height: 34)
                                  .overlay(Circle().strokeBorder(Color.white.opacity(0.55), lineWidth: 1))
                              Image(systemName: entry.isPlaying ? "waveform" : "music.note")
                                  .font(.system(size: 14, weight: .semibold))
                                  .foregroundColor(entry.isPlaying ? FengGlass.aqua : .white.opacity(0.85))
                          }
                      }

                      Spacer(minLength: 2)

                      Text(entry.hasLiveSync ? entry.title : "FENG MUSIC")
                          .font(.system(size: 13.5, weight: .bold))
                          .foregroundColor(.white)
                          .lineLimit(1)
                          .frame(maxWidth: .infinity, alignment: .center)

                      if #available(iOS 17.0, *) {
                          HStack(spacing: 12) {
                              Button(intent: FengPrevTrackIntent()) {
                                  Image(systemName: "backward.fill")
                                      .font(.system(size: 11, weight: .bold))
                                      .foregroundColor(.white.opacity(0.92))
                              }
                              .buttonStyle(.plain)

                              Button(intent: FengTogglePlayIntent()) {
                                  Image(systemName: entry.isPlaying ? "pause.fill" : "play.fill")
                                      .font(.system(size: 13, weight: .bold))
                                      .foregroundColor(.white)
                              }
                              .buttonStyle(.plain)

                              Button(intent: FengNextTrackIntent()) {
                                  Image(systemName: "forward.fill")
                                      .font(.system(size: 11, weight: .bold))
                                      .foregroundColor(.white.opacity(0.92))
                              }
                              .buttonStyle(.plain)
                          }
                          .frame(maxWidth: .infinity)
                          .padding(.vertical, 7)
                          .background(Color.white.opacity(0.18))
                          .clipShape(Capsule())
                          .overlay(Capsule().strokeBorder(Color.white.opacity(0.50), lineWidth: 1))
                      }
                  }
                  .padding(13)
              }

              private var mediumBody: some View {
                  HStack(spacing: 8) {
                      // Left Stage: Superellipse Cover + Dual-State Peeking Vinyl (extends when playing, tucks back when paused)
                      ZStack(alignment: .leading) {
                          PeekingVinylDisc(diameter: 106, active: entry.isPlaying)
                              .offset(x: entry.isPlaying ? 42 : 22)
                          SuperellipseCoverView(image: entry.coverImage, size: 114, cornerRadius: 28)
                      }
                      .frame(width: 150, height: 118, alignment: .leading)

                      // Right Stage: Dynamic Now Playing OR Idle Sunset Quote + Dual-State Cyan Wave + Floating Glass Capsule Dock
                      VStack(alignment: .trailing, spacing: 5) {
                          if entry.hasLiveSync {
                              HStack(spacing: 5) {
                                  Circle()
                                      .fill(entry.isPlaying ? FengGlass.aqua : Color.white.opacity(0.45))
                                      .frame(width: 5, height: 5)
                                  Text(entry.isPlaying ? "LOSSLESS" : "PAUSED")
                                      .font(.system(size: 9.5, weight: .bold, design: .rounded))
                                      .tracking(0.8)
                                      .foregroundColor(.white.opacity(0.88))
                              }
                              .padding(.horizontal, 8)
                              .padding(.vertical, 3)
                              .background(Color.white.opacity(0.16))
                              .clipShape(Capsule())
                              .overlay(Capsule().strokeBorder(Color.white.opacity(0.40), lineWidth: 0.8))

                              Text(entry.title)
                                  .font(.system(size: 16, weight: .bold))
                                  .foregroundColor(.white)
                                  .lineLimit(1)
                                  .frame(maxWidth: .infinity, alignment: .trailing)

                              Text(entry.subtitle)
                                  .font(.system(size: 11.5, weight: .medium))
                                  .foregroundColor(.white.opacity(0.76))
                                  .lineLimit(1)
                                  .frame(maxWidth: .infinity, alignment: .trailing)
                          } else {
                              Text("All the promises I\nmade at sunset were\nas real as any other")
                                  .font(.system(size: 12.5, weight: .regular, design: .serif))
                                  .italic()
                                  .multilineTextAlignment(.trailing)
                                  .lineSpacing(1.2)
                                  .minimumScaleFactor(0.82)
                                  .foregroundColor(.white.opacity(0.95))
                                  .shadow(color: FengGlass.sky.opacity(0.32), radius: 5, x: 0, y: 0)
                                  .frame(maxWidth: .infinity, alignment: .trailing)
                          }

                          // Dual-State Cyan Waveform (expanded & glowing when playing; calm flat line when paused/idle)
                          ZStack {
                              if entry.isPlaying {
                                  AdaptiveWaveShape(active: true)
                                      .stroke(FengGlass.aqua.opacity(0.68), style: StrokeStyle(lineWidth: 4.2, lineCap: .round))
                                      .blur(radius: 3.2)
                              }
                              AdaptiveWaveShape(active: entry.isPlaying)
                                  .stroke(
                                      LinearGradient(
                                          colors: entry.isPlaying
                                              ? [FengGlass.sky.opacity(0.75), Color.white.opacity(0.95), FengGlass.aqua]
                                              : [Color.white.opacity(0.28), FengGlass.sky.opacity(0.42), Color.white.opacity(0.28)],
                                          startPoint: .leading,
                                          endPoint: .trailing
                                      ),
                                      style: StrokeStyle(lineWidth: entry.isPlaying ? 1.6 : 1.1, lineCap: .round)
                                  )
                          }
                          .frame(height: 16)
                          .padding(.horizontal, 2)

                          GlassCapsuleControlDock(isPlaying: entry.isPlaying)
                      }
                      .frame(maxWidth: .infinity)
                  }
                  .padding(.horizontal, 13)
                  .padding(.vertical, 12)
              }
          }

          struct AlbumAdaptiveContainerBackground: ViewModifier {
              let coverImage: UIImage?
              let hasLiveSync: Bool
              let cornerRadius: CGFloat

              func body(content: Content) -> some View {
                  if #available(iOS 17.0, *) {
                      content.containerBackground(for: .widget) {
                          AlbumAdaptiveLiquidBackground(
                              coverImage: coverImage,
                              hasLiveSync: hasLiveSync,
                              cornerRadius: cornerRadius
                          )
                      }
                  } else {
                      content.background(
                          AlbumAdaptiveLiquidBackground(
                              coverImage: coverImage,
                              hasLiveSync: hasLiveSync,
                              cornerRadius: cornerRadius
                          )
                      )
                  }
              }
          }

          @main
          struct FengNowPlayingWidget: Widget {
              let kind: String = "FengNowPlayingWidget"

              var body: some WidgetConfiguration {
                  StaticConfiguration(kind: kind, provider: FengWidgetProvider()) { entry in
                      FengWidgetEntryView(entry: entry)
                  }
                  .configurationDisplayName("FENG MUSIC 流光黑胶")
                  .description("封面流光自适应液态玻璃与黑胶唱片小组件，支持实时状态同步与桌面切歌。")
                  .supportedFamilies([.systemSmall, .systemMedium])
                  .contentMarginsDisabled()
              }
          }
          EOF

      - name: Register FengWidgetExtension Target in Xcode
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.feng.music' }}
        run: |
          WIDGET_BUNDLE_ID="${BUNDLE_ID}.widget"
          gem list -i xcodeproj || sudo gem install xcodeproj --no-document || gem install --user-install xcodeproj --no-document

          cat << 'EOF' > add_widget_target.rb
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          bundle_id = ENV['BUNDLE_ID'] || 'com.feng.music'
          widget_bundle_id = ENV['WIDGET_BUNDLE_ID'] || "#{bundle_id}.widget"

          app_target = project.targets.find { |t| t.name == 'App' }
          raise 'App target not found' unless app_target

          app_group = project.main_group.find_subpath('App', true)
          app_ent_ref = app_group.new_file('App.entitlements')
          app_target.build_configurations.each do |config|
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = bundle_id
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end

          widget_target = project.new_target(:app_extension, 'FengWidgetExtension', :ios, '16.0')
          widget_group = project.main_group.new_group('FengWidgetExtension', 'FengWidgetExtension')
          swift_ref = widget_group.new_file('FengWidget.swift')
          icon_ref = widget_group.new_file('widget-icon.png')
          widget_group.new_file('Info.plist')
          widget_group.new_file('FengWidgetExtension.entitlements')
          widget_target.add_file_references([swift_ref])
          widget_target.resources_build_phase.add_file_reference(icon_ref)

          widget_target.build_configurations.each do |config|
            config.build_settings['PRODUCT_NAME'] = '$(TARGET_NAME)'
            config.build_settings['WRAPPER_EXTENSION'] = 'appex'
            config.build_settings['PRODUCT_BUNDLE_PACKAGE_TYPE'] = 'XPC!'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = widget_bundle_id
            config.build_settings['INFOPLIST_FILE'] = 'FengWidgetExtension/Info.plist'
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'FengWidgetExtension/FengWidgetExtension.entitlements'
            config.build_settings['SWIFT_VERSION'] = '5.0'
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1,2'
            config.build_settings['GENERATE_INFOPLIST_FILE'] = 'NO'
            config.build_settings['SKIP_INSTALL'] = 'YES'
            config.build_settings['LD_RUNPATH_SEARCH_PATHS'] = '$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = ''
            config.build_settings['APPLICATION_EXTENSION_API_ONLY'] = 'YES'
          end

          widget_target.add_system_framework('WidgetKit')
          widget_target.add_system_framework('SwiftUI')

          app_target.add_dependency(widget_target)
          embed_phase = app_target.new_copy_files_build_phase('Embed Foundation Extensions')
          embed_phase.dst_subfolder_spec = '13'
          embed_phase.dst_path = ''
          build_file = embed_phase.add_file_reference(widget_target.product_reference)
          build_file.settings = { 'ATTRIBUTES' => ['RemoveHeadersOnCopy'] }

          project.save
          puts "Successfully added FengWidgetExtension (#{widget_bundle_id}) to #{project_path}"
          EOF

          BUNDLE_ID="$BUNDLE_ID" WIDGET_BUNDLE_ID="$WIDGET_BUNDLE_ID" ruby add_widget_target.rb

      - name: Build Unsigned iOS IPA
        run: |
          set -o pipefail
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET="-workspace ios/App/App.xcworkspace"
          else
            TARGET="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee xcodebuild.log
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          ls -la Payload/App.app/PlugIns/ || true
          zip -qr FENG_MUSIC_iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: FENG_MUSIC_iOS_IPA
          path: FENG_MUSIC_iOS.ipa