                                  .resizable()
                                  .aspectRatio(contentMode: .fill)
                          } else {
                              ZStack {
                                  LinearGradient(
                                      colors: [Color.white, FengGlassPalette.ice],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  )
                                  Image(systemName: "music.note")
                                      .font(.system(size: size * 0.44, weight: .bold))
                                      .foregroundStyle(
                                          LinearGradient(
                                              colors: [FengGlassPalette.sky, FengGlassPalette.aqua],
                                              startPoint: .topLeading,
                                              endPoint: .bottomTrailing
                                          )
                                      )
                              }
                          }
                      }
                      .frame(width: size, height: size)
                      .clipShape(RoundedRectangle(cornerRadius: cornerRadius, style: .continuous))
                      .overlay(
                          // Specular glass highlight arc on top-left corner
                          RoundedRectangle(cornerRadius: cornerRadius, style: .continuous)
                              .strokeBorder(
                                  LinearGradient(
                                      colors: [Color.white.opacity(0.95), FengGlassPalette.sky.opacity(0.32), Color.white.opacity(0.65)],
                                      startPoint: .topLeading,
