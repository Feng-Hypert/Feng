                  }
              }
          }

          struct GlassCircleButtonLabel: View {
              let symbol: String
              let size: CGFloat
              let primary: Bool

              var body: some View {
                  Image(systemName: symbol)
                      .font(.system(size: primary ? 14 : 12, weight: .bold))
