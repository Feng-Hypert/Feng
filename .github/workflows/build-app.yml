name: Build Offline Android APK & iOS IPA

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Web Assets & Android
        run: |
          mkdir -p www
          cp radio.html www/index.html
          cp icon-512.png www/icon-512.png
          sed -i 's|"/icon-512.png"|"./icon-512.png"|g' www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.feng.music",
            "appName": "FENG MUSIC",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6
          npx cap add android
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp icon-512.png "android/app/src/main/res/$dir/ic_launcher.png"
            cp icon-512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            cp icon-512.png "android/app/src/main/res/$dir/ic_launcher_foreground.png"
          done

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FENG_MUSIC_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Capacitor iOS
        run: |
          mkdir -p www
          cp radio.html www/index.html
          cp icon-512.png www/icon-512.png
          sed -i '' 's|"/icon-512.png"|"./icon-512.png"|g' www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.feng.music",
            "appName": "FENG MUSIC",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 @capacitor/filesystem@6
          npx cap add ios

      - name: Configure iOS Files App Sharing & Background Audio
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true

      - name: Enable Native iOS Lock Screen Prev/Next Track Controls
        run: |
          cat << 'EOF' > ios/App/App/AppDelegate.swift
          import UIKit
          import Capacitor
          import MediaPlayer
          import AVFoundation
          import WebKit

          final class FengRemoteMediaBridge: NSObject, WKScriptMessageHandler {
              static let shared = FengRemoteMediaBridge()
              private var isConfigured = false
              private var isAttached = false
              weak var webView: WKWebView?

              func configureAudioAndCommands() {
                  guard !isConfigured else { return }
                  isConfigured = true
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default)
                  try? AVAudioSession.sharedInstance().setActive(true)

                  let cmd = MPRemoteCommandCenter.shared()
                  cmd.skipBackwardCommand.isEnabled = false
                  cmd.skipForwardCommand.isEnabled = false
                  cmd.previousTrackCommand.isEnabled = true
                  cmd.nextTrackCommand.isEnabled = true

                  cmd.previousTrackCommand.addTarget { [weak self] _ in
                      DispatchQueue.main.async {
                          self?.webView?.evaluateJavaScript("window.__fengPrevTrack && window.__fengPrevTrack()", completionHandler: nil)
                      }
                      return .success
                  }

                  cmd.nextTrackCommand.addTarget { [weak self] _ in
                      DispatchQueue.main.async {
                          self?.webView?.evaluateJavaScript("window.__fengNextTrack && window.__fengNextTrack()", completionHandler: nil)
                      }
                      return .success
                  }
              }

              func attach(window: UIWindow?) {
                  guard !isAttached,
                        let bridgeVC = window?.rootViewController as? CAPBridgeViewController,
                        let wv = bridgeVC.webView else { return }
                  isAttached = true
                  self.webView = wv
                  wv.configuration.userContentController.add(self, name: "fengMedia")
                  applyRemoteCommands()
              }

              func applyRemoteCommands() {
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.15) {
                      let cmd = MPRemoteCommandCenter.shared()
                      cmd.skipBackwardCommand.isEnabled = false
                      cmd.skipForwardCommand.isEnabled = false
                      cmd.previousTrackCommand.isEnabled = true
                      cmd.nextTrackCommand.isEnabled = true
                  }
              }

              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  applyRemoteCommands()
              }
          }

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  FengRemoteMediaBridge.shared.configureAudioAndCommands()
                  return true
              }

              func applicationDidBecomeActive(_ application: UIApplication) {
                  FengRemoteMediaBridge.shared.attach(window: window)
              }

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          EOF

      - name: Force Replace iOS App Icon
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$ICON_DIR"
          mkdir -p "$ICON_DIR"
          sips -s format png -z 1024 1024 icon-512.png --out "$ICON_DIR/AppIcon-512@2x.png"
          cat << 'EOF' > "$ICON_DIR/Contents.json"
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Build Unsigned iOS IPA
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET="-workspace ios/App/App.xcworkspace"
          else
            TARGET="-project ios/App/App.xcodeproj"
          fi
          xcodebuild $TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr FENG_MUSIC_iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: FENG_MUSIC_iOS_IPA
          path: FENG_MUSIC_iOS.ipa
