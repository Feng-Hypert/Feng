                      Circle()
                          .stroke(
                              LinearGradient(
                                  colors: [Color.white.opacity(0.34), FengGlass.aqua.opacity(0.24), Color.black.opacity(0.45)],
                                  startPoint: .topLeading,
                                  endPoint: .bottomTrailing
                              ),
                              lineWidth: 1.0
                          )
                  }
                  .frame(width: diameter, height: diameter)
                  .shadow(color: Color.black.opacity(0.50), radius: 9, x: 4, y: 4)
              }
          }

          struct SuperellipseCoverView: View {
              let image: UIImage?
              let size: CGFloat
              let cornerRadius: CGFloat

              var body: some View {
                  Group {
                      if let uiImage = image {
                          Image(uiImage: uiImage)
                              .resizable()
                              .aspectRatio(contentMode: .fill)
                      } else {
                          ZStack {
                              LinearGradient(colors: [FengGlass.midOcean, FengGlass.deepNavy], startPoint: .topLeading, endPoint: .bottomTrailing)
                              Image(systemName: "music.note")
                                  .font(.system(size: size * 0.42, weight: .bold))
                                  .foregroundColor(FengGlass.sky)
                          }
                      }
                  }
                  .frame(width: size, height: size)
                  .clipShape(RoundedRectangle(cornerRadius: cornerRadius, style: .continuous))
                  .overlay(
