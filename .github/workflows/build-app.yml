      - name: Write FengWidget.swift (Liquid Glass UI)
        run: |
          cat << 'EOF' > ios/App/FengWidgetExtension/FengWidget.swift
          import WidgetKit
          import SwiftUI
          import UIKit
          import AppIntents

          private func fengWidgetGroupID() -> String {
              if let id = Bundle.main.object(forInfoDictionaryKey: "FengAppGroup") as? String, !id.isEmpty {
                  return id
              }
              return "group.78G3Q25PQG.1iKc"
          }

          private func postDarwinWidgetCommand(_ suffix: String) {
              let groupID = fengWidgetGroupID()
              if suffix == "toggle", let defaults = UserDefaults(suiteName: groupID) {
                  let cur = defaults.bool(forKey: "widget_isPlaying")
                  defaults.set(!cur, forKey: "widget_isPlaying")
                  defaults.synchronize()
              }
              let center = CFNotificationCenterGetDarwinNotifyCenter()
              let name = CFNotificationName("com.feng.music.widget.\(suffix)" as CFString)
              CFNotificationCenterPostNotification(center, name, nil, nil, true)
          }

          private func loadBundledAppIcon() -> UIImage? {
              if let path = Bundle.main.path(forResource: "widget-icon", ofType: "png") {
                  return UIImage(contentsOfFile: path)
              }
              return nil
          }

          @available(iOS 17.0, *)
          struct FengTogglePlayIntent: AppIntent {
              static var title: LocalizedStringResource = "播放/暂停"
              static var openAppWhenRun: Bool = false

              func perform() async throws -> some IntentResult {
                  postDarwinWidgetCommand("toggle")
                  return .result()
              }
          }

          @available(iOS 17.0, *)
          struct FengNextTrackIntent: AppIntent {
              static var title: LocalizedStringResource = "下一首"
              static var openAppWhenRun: Bool = false

              func perform() async throws -> some IntentResult {
                  postDarwinWidgetCommand("next")
                  try? await Task.sleep(nanoseconds: 550_000_000)
                  return .result()
              }
          }

          @available(iOS 17.0, *)
          struct FengPrevTrackIntent: AppIntent {
              static var title: LocalizedStringResource = "上一首"
              static var openAppWhenRun: Bool = false

              func perform() async throws -> some IntentResult {
                  postDarwinWidgetCommand("prev")
                  try? await Task.sleep(nanoseconds: 550_000_000)
                  return .result()
              }
          }

          struct FengWidgetEntry: TimelineEntry {
              let date: Date
              let title: String
              let subtitle: String
              let isPlaying: Bool
              let hasLiveSync: Bool
              let coverImage: UIImage?
          }

          struct FengWidgetProvider: TimelineProvider {
              private func loadEntry(for date: Date) -> FengWidgetEntry {
                  let groupID = fengWidgetGroupID()
                  let defaults = UserDefaults(suiteName: groupID)
                  let syncedTitle = (defaults?.string(forKey: "widget_title") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  let syncedArtist = (defaults?.string(forKey: "widget_artist") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  let syncedAlbum = (defaults?.string(forKey: "widget_album") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  let isPlaying = defaults?.bool(forKey: "widget_isPlaying") ?? false

                  var cover: UIImage? = nil
                  if let containerURL = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: groupID) {
                      let fileName = defaults?.string(forKey: "widget_cover_file") ?? "widget_cover.jpg"
                      let primaryURL = containerURL.appendingPathComponent(fileName)
                      let fallbackURL = containerURL.appendingPathComponent("widget_cover.jpg")
                      if let data = (try? Data(contentsOf: primaryURL)) ?? (try? Data(contentsOf: fallbackURL)) {
                          cover = UIImage(data: data)
                      }
                  }

                  let hasLive = !syncedTitle.isEmpty && syncedTitle != "FENG MUSIC"
                  let sub: String
                  if !syncedArtist.isEmpty && !syncedAlbum.isEmpty && syncedAlbum != "未知专辑" {
                      sub = "\(syncedArtist) · \(syncedAlbum)"
                  } else if !syncedArtist.isEmpty {
                      sub = syncedArtist
                  } else {
                      sub = "FENG MUSIC"
                  }

                  return FengWidgetEntry(
                      date: date,
                      title: hasLive ? syncedTitle : "FENG MUSIC",
                      subtitle: sub,
                      isPlaying: isPlaying,
                      hasLiveSync: hasLive,
                      coverImage: cover ?? loadBundledAppIcon()
                  )
              }

              func placeholder(in context: Context) -> FengWidgetEntry {
                  loadEntry(for: Date())
              }

              func getSnapshot(in context: Context, completion: @escaping (FengWidgetEntry) -> Void) {
                  completion(loadEntry(for: Date()))
              }

              func getTimeline(in context: Context, completion: @escaping (Timeline<FengWidgetEntry>) -> Void) {
                  let now = Date()
                  let entry = loadEntry(for: now)
                  let groupID = fengWidgetGroupID()
                  let defaults = UserDefaults(suiteName: groupID)
                  let expectedEndTs = defaults?.double(forKey: "widget_expectedEndAt") ?? 0
                  let defaultNext = Calendar.current.date(byAdding: .minute, value: 15, to: now) ?? now.addingTimeInterval(900)
                  let nextRefresh: Date
                  if entry.isPlaying && expectedEndTs > now.timeIntervalSince1970 + 2 {
                      nextRefresh = min(defaultNext, Date(timeIntervalSince1970: expectedEndTs))
                  } else {
                      nextRefresh = defaultNext
                  }
                  completion(Timeline(entries: [entry], policy: .after(nextRefresh)))
              }
          }

          // MARK: - Style 2 Album-Adaptive Liquid Glass + Dual-State Vinyl & Cyan Wave
          private enum FengGlass {
              static let sky = Color(red: 0.28, green: 0.78, blue: 1.00)
              static let aqua = Color(red: 0.26, green: 0.90, blue: 0.85)
              static let deepNavy = Color(red: 0.04, green: 0.08, blue: 0.14)
              static let midOcean = Color(red: 0.08, green: 0.16, blue: 0.26)
          }

          struct AdaptiveWaveShape: Shape {
              let active: Bool

              func path(in rect: CGRect) -> Path {
                  var p = Path()
                  let w = rect.width
                  let midY = rect.midY
                  let amp = active ? rect.height * 0.44 : rect.height * 0.07
                  p.move(to: CGPoint(x: 0, y: midY))
                  p.addCurve(
                      to: CGPoint(x: w * 0.20, y: midY - amp * 0.35),
                      control1: CGPoint(x: w * 0.07, y: midY),
                      control2: CGPoint(x: w * 0.13, y: midY - amp * 0.35)
                  )
                  p.addCurve(
                      to: CGPoint(x: w * 0.36, y: midY - amp * 0.92),
                      control1: CGPoint(x: w * 0.26, y: midY - amp * 0.35),
                      control2: CGPoint(x: w * 0.30, y: midY - amp * 0.92)
                  )
                  p.addCurve(
                      to: CGPoint(x: w * 0.50, y: midY + amp * 0.84),
                      control1: CGPoint(x: w * 0.42, y: midY - amp * 0.92),
                      control2: CGPoint(x: w * 0.44, y: midY + amp * 0.84)
                  )
                  p.addCurve(
                      to: CGPoint(x: w * 0.66, y: midY - amp * 0.76),
                      control1: CGPoint(x: w * 0.56, y: midY + amp * 0.84),
                      control2: CGPoint(x: w * 0.60, y: midY - amp * 0.76)
                  )
                  p.addCurve(
                      to: CGPoint(x: w * 0.82, y: midY + amp * 0.38),
                      control1: CGPoint(x: w * 0.72, y: midY - amp * 0.76),
                      control2: CGPoint(x: w * 0.76, y: midY + amp * 0.38)
                  )
                  p.addCurve(
                      to: CGPoint(x: w, y: midY),
                      control1: CGPoint(x: w * 0.90, y: midY + amp * 0.38),
                      control2: CGPoint(x: w * 0.95, y: midY)
                  )
                  return p
              }
          }

          struct AlbumAdaptiveLiquidBackground: View {
              let coverImage: UIImage?
              let hasLiveSync: Bool
              let cornerRadius: CGFloat

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          LinearGradient(
                              colors: [FengGlass.deepNavy, FengGlass.midOcean, Color(red: 0.04, green: 0.08, blue: 0.16)],
                              startPoint: .topLeading,
                              endPoint: .bottomTrailing
                          )

                          if hasLiveSync, let uiImage = coverImage {
                              Image(uiImage: uiImage)
                                  .resizable()
                                  .aspectRatio(contentMode: .fill)
                                  .frame(width: geo.size.width, height: geo.size.height)
                                  .blur(radius: 30)
                                  .scaleEffect(1.32)
                                  .saturation(1.35)
                                  .opacity(0.68)

                              LinearGradient(
                                  colors: [Color.black.opacity(0.24), Color.black.opacity(0.46)],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                          } else {
                              Circle()
                                  .fill(
                                      RadialGradient(
                                          colors: [FengGlass.aqua.opacity(0.32), FengGlass.sky.opacity(0.10), .clear],
                                          center: .center,
